# MediaMTX 설정 — PokeClip 로컬 개발용 (docker-compose의 media 서비스가 /mediamtx.yml로 마운트)
# 값 근거: ADR-020(세그먼트 4s·part 0.5s·DVR 1h=900개) + 2026-07-25 스파이크 검증(hlsDirectory 디스크 오프로드)
# 송출 규약: MPEG-TS · H.264 · AAC · 인코더 GOP 2초 고정(30fps -g 60 / 60fps -g 120) — 플러그인이 강제(ADR-020)

# 인제스트
srt: yes
srtAddress: :8890
rtmp: yes # 로컬 ffmpeg 테스트용 (homebrew ffmpeg은 SRT 미포함 — OBS는 SRT 사용)
rtmpAddress: :1935

# 미사용 프로토콜 비활성화
rtsp: no
webrtc: no
moq: no

# Control API (POK-195) — 사이드카의 상태 관측(mtxstate 폴러)이 GET /v3/paths/list 를 읽는다.
# **호스트에 포트를 공개하지 않는다**(docker-compose.yml 의 media 서비스 ports 에 9997 없음).
# 도달 범위는 compose 브리지 네트워크 안뿐이다.
api: yes
apiAddress: :9997

# 인증 — **이 키를 적는 순간 기본 사용자 목록이 통째로 대체된다**(전체 설정 대체 규약).
# 그래서 아래 두 항목은 포크 태그(v1.20.1-pokeclip.1) 기본값 원문을 그대로 옮긴 것이다.
# 첫 항목(익명 publish/read/playback)이 빠지면 SRT 송출과 LL-HLS 재생이 동시에 죽고,
# 둘째 항목(localhost 관리자)을 지우면 되돌리기 축이 사라진다 — 둘 다 손대지 마라.
# 셋째 항목만 우리가 더한 것이다.
authInternalUsers:
  # Default unprivileged user.
  # Username. 'any' means any user, including anonymous ones.
  - user: any
    # Password. Not used in case of 'any' user.
    pass:
    # IPs or networks allowed to use this user. An empty list means any IP.
    ips: []
    # Permissions.
    permissions:
      # Available actions are: publish, read, playback, api, metrics, pprof.
      - action: publish
        # Paths can be set to further restrict access to a specific path.
        # An empty path means any path.
        # Regular expressions can be used by using a tilde as prefix.
        path:
      - action: read
        path:
      - action: playback
        path:

    # Default administrator.
    # This allows to use API, metrics and PPROF without authentication,
    # if the IP is localhost.
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: api
      - action: metrics
      - action: pprof

  # ↑ 여기까지가 기본값 원문. ↓ 아래 한 항목만 PokeClip 이 더했다 (POK-195).
  #
  # 사이드카는 다른 컨테이너라 위 관리자 항목의 localhost 조건을 못 만족한다(실측: 401
  # {"error":"authentication error"}). 그래서 api 권한만 여는 항목을 하나 더한다.
  # **자격증명 성분(pass)을 두지 않는다** — 평문 커밋 금지 불변식(ADR-018)에 걸린다.
  # **ips 대역도 지정하지 않는다** — compose 에 IPAM/subnet 선언이 없어 대역이 재생성마다
  # 바뀔 수 있고, IPAM 신설은 인프라 축 확대라 별도 회부 사안이다. 대신 ⑴ compose 전용
  # 브리지 네트워크 격리 ⑵ 9997 미공개 두 겹에 의존한다.
  # 잔여 위험(같은 네트워크의 다른 우리 컨테이너도 API 를 부를 수 있다)은 M5 강화 축으로 이관.
  - user: any
    permissions:
      - action: api

# LL-HLS 재생 + DVR
hls: yes
hlsAddress: :8888
hlsVariant: lowLatency
hlsSegmentDuration: 4s
hlsPartDuration: 500ms
hlsSegmentCount: 900 # DVR 1h = 4s x 900
hlsDirectory: /dvr # 세그먼트 디스크 오프로드 (메모리 상주 방지, 07-25 검증 방식)
hlsAllowOrigins: ["*"] # 로컬 개발 전용 — 프로덕션은 CloudFront/Signed Cookie 경로라 이 값 안 씀

# 녹화 (M1 2단계 사이드카(인덱서·S3 업로더)가 감시할 대상 자리)
pathDefaults:
  record: yes
  recordFormat: fmp4
  recordSegmentDuration: 4s
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f

  # 훅 (ADR-027) — 사이드카 수신 어댑터 internal/mtxhook 의 1차 신호원.
  # 벽시계 드리프트·파일 감시·주기 재스캔은 안전망으로 그대로 남는다(제거 금지).
  # pathDefaults 는 all_others 에도 상속된다(v1.19.3·v1.20.1 conf 로딩이 defaults 를 먼저 복사 — 08-28 재확인).
  # 명칭 주의: 구명칭 runOnReady 는 runOnAvailable 로 매핑되며 Online 이 아니다 — 쓰지 않는다.
  # Restart 계열은 기본값(no)을 그대로 쓴다(실측: Restart:false 기준 재실행 0).
  # /hooks-bin/mtxhookwrite 는 media/Dockerfile.mtxhook 이 이미지에 얹은 정적 바이너리다.
  # 이 세 줄에 `$` 를 넣지 않는다. v1.19.3·v1.20.1 은 명령 문자열을 먼저 shell 규칙으로 쪼갠 뒤
  # 각 조각에 대해 변수를 치환하므로, `$MTX_PATH` 를 넣어도 인자 **개수**가 늘지는 않는다.
  # 대신 그 인자 **하나의 내용이 송출자 제어**가 된다(경로 이름은 송출자가 정한다).
  # 값은 전부 훅 프로세스의 환경변수로 넘어오고 mtxhookwrite 가 거기서 읽으므로,
  # 명령줄에 변수를 심을 이유 자체가 없다.
  runOnOnline: /hooks-bin/mtxhookwrite -kind online
  runOnOffline: /hooks-bin/mtxhookwrite -kind offline
  runOnRecordSegmentComplete: /hooks-bin/mtxhookwrite -kind segcomplete

# 경로 허용 — 이 절이 없으면 모든 스트림이 "path not configured"로 거부된다 (전체 설정 대체 시 필수)
paths:
  all_others:
