# 정적 세그먼트 스텁 (M1 1-2) — 계약3 URL 형태(/live/{streamId}/index.m3u8)로 사전 생성 세그먼트 서빙
server {
    listen 80;

    # 주의: server 블록의 types 는 http 레벨의 mime.types 를 **통째로 대체**한다.
    # 여기 없는 확장자는 전부 application/octet-stream 으로 나간다 — 새 자산을 서빙할 때마다
    # 이 목록에 추가해야 하고, 고친 뒤에는 컨테이너를 다시 띄워야 반영된다(:ro 마운트).
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp4 mp4;
        video/iso.segment m4s;
        # 편집기 로컬 소스(POK-238) — 사이드카와 필름스트립 스프라이트
        application/json json;
        image/jpeg jpg jpeg;
    }

    root /data;

    location /live/ {
        # 계약3 §1: app과 media가 다른 오리진 + 쿠키(credentials) 전제 → 와일드카드 불가, 요청 오리진 반사
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Cache-Control no-cache always;
    }
}
