# 로컬 엣지 — 브라우저(http://localhost:3000)가 받는 되감기 목록 · 조각의 길이다(POK-200 · 설계 M5 9.4.2 B안).
# prod 엣지(CloudFront)의 /dvr/* 비헤이비어와 같은 꼴만 흉내 낸다: 경로 /dvr/… · CORS(정확 일치 + 자격) · 원본 머리 전달 ·
# 목록 거부. 엣지 캐시(TTL 합치기 · 오류 캐시)는 흉내 내지 않는다 — O7f 실측 몫이다.
# prod 와 다른 점(README 「prod 엣지와 다른 점」 과 같은 목록): ① 엣지 캐시가 없다(위) ② x-amz-* 응답 머리를 지운다(MinIO
# 고유 머리가 웹 판별을 흐리지 않게 — prod 는 지우지 않는다, 4.7절) ③ MinIO 가 스스로 싣는 CORS 머리를 지운다(아래 —
# 두 번 나가면 브라우저가 거부한다). 제어면은 이 엣지를 거치지 않는다.

map $http_origin $cors_origin {
    default "";
    "http://localhost:3000" "http://localhost:3000";
}

server {
    listen 80;
    server_tokens off;

    location /dvr/ {
        limit_except GET OPTIONS {
            deny all; # GET 은 HEAD 를 함께 받는다 — 그 밖 메서드는 403
        }
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary Origin always;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Max-Age 600 always;
            add_header Vary Origin always;
            return 204;
        }

        proxy_pass https://minio:9000/pokeclip-rewind-local/dvr/;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /run/rewind-minio-ca/ca.crt;
        proxy_ssl_name minio;
        proxy_ssl_server_name on;
        proxy_set_header Host minio:9000;

        # MinIO 도 CORS 머리를 스스로 싣는다 — 그대로 두면 Access-Control-Allow-Origin 이 두 번 나가 브라우저가 거부한다
        # (2026-10-26 실측). CORS 는 이 엣지의 머리 하나만 남긴다.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Vary;

        # 원본 Cache-Control · Content-Type 은 그대로 넘긴다(②b 객체 머리의 로컬 판별 자리). MinIO 고유 머리는 지운다.
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-meta-pc-gen;
        proxy_hide_header x-amz-meta-pc-pub-seq;
        proxy_hide_header x-amz-meta-pc-session;
        proxy_hide_header x-amz-meta-pc-terminal;
        proxy_hide_header x-amz-meta-pc-msn;
        proxy_hide_header x-amz-meta-pc-seg-count;
        proxy_hide_header x-amz-meta-pc-disc-seq;
        proxy_hide_header x-amz-meta-pc-body-sha256;
        proxy_hide_header x-minio-error-code;
        proxy_hide_header x-minio-error-desc;
        proxy_hide_header x-ratelimit-limit;
        proxy_hide_header x-ratelimit-remaining;
    }

    # 그 밖 경로(버킷 루트 목록 · streams/ 원본 포함)는 엣지가 받지 않는다.
    location / {
        return 404;
    }
}
