# modules/media_host 가 쓴다. 설치 묶음(스크립트 · 템플릿)을 꺼내 설치하지
# 못했으면 시작 스크립트의 선행 점검과 같은 꼴로 기동을 막는다. 유닛이
# 20초마다(RestartSec) 기동을 다시 시도할 때 이 표지 확인도 다시 돌지만 설치는
# 다시 하지 않는다 — 표지는 첫 부팅에 한 번 도는 부트스트랩이 설치를 모두
# 끝낸 뒤에만 쓴다.
[Service]
ExecStartPre=/bin/sh -c 'test -f /var/lib/pokeclip-media/bundle-installed || \
  { echo "MEDIA PREREQ FAIL bundle"; exit 1; }'
