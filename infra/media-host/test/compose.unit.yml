# 유닛 재기동 시험 compose — unit_restart_test.sh 가 시험 유닛(pcbench-edge-proxy)의
# MEDIA_COMPOSE_FILE 로 넘기고, 유닛이 bin/start-media.sh 로 띄운다.
#
# 서비스 이름 · 망 칸 · 재시작 정책 · cap · ulimits · 볼륨 읽기 전용 여부 · bind
# 원본 자동 생성 여부 · 로깅은 prod 템플릿(compose.yml.tmpl)과 같게 둔다 —
# 드리프트 단언이 이름이 같은 서비스끼리 비교하고, 이 파일만 로깅까지 본다(CI
# 엔진에는 journald 가 있다. 로컬 OrbStack 에는 없어 이 파일은 로컬에서 띄울 수
# 없다). 다른 점은 이미지와 명령뿐이다:
#   - mediamtx: 에코(test/echo) — 망 칸 주인 · 종료 제어(관리 포트 POST /exit?code=N).
#     출력 연결 서비스가 종료를 맡아야 compose 전체가 내려간다(비부착 서비스의
#     종료는 compose 를 멈추지 않는다).
#   - nginx: 공식 이미지(images.json 핀) + 시험이 쓰는 최소 설정 — 헬스 포트 · 경로
#     하나만 고정 200(사례 9 재통과 판정).
#   - sidecar: 에코 sidecar — 시작마다 표식 줄, 지정 지연 뒤 종료 1.
#
# 값은 모두 시험 env 파일(유닛 EnvironmentFile)이 넣는다(빈 값이면 compose 가 멈춘다):
#   PCBENCH_ECHO_IMAGE · PCBENCH_NGINX_IMAGE · PCBENCH_NGINX_CONF ·
#   PCBENCH_HEALTH_PORT · PCBENCH_ECHO_ADMIN_PORT · PCBENCH_SIDECAR_EXIT_DELAY ·
#   RUNTIME_DIR(유닛 drop-in — start-media.sh 가 렌더하는 자리).
#
# 실험 식별: 프로젝트 pcbench-edge-proxy · 라벨 com.pokeclip.bench=edge-proxy(컨테이너 ·
# 망 · 볼륨). 호스트 게시는 127.0.0.1 의 헬스 포트 하나다.
name: pcbench-edge-proxy

x-bench-labels: &bench-labels
  com.pokeclip.bench: edge-proxy

x-attached-logging: &attached-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-mediamtx-dependency: &mediamtx-dependency
  mediamtx:
    condition: service_started
    restart: true

services:
  mediamtx:
    image: ${PCBENCH_ECHO_IMAGE:?unit_restart_test.sh 가 넣는다}
    pull_policy: never
    command:
      - serve
      - -bind=127.0.0.1
      - -listen_ports=8888
      - -admin_port=${PCBENCH_ECHO_ADMIN_PORT:?}
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      core: 0
    ports:
      - 127.0.0.1:${PCBENCH_HEALTH_PORT:?}:${PCBENCH_HEALTH_PORT:?}
    volumes:
      - recordings:/recordings
      - hooks:/hooks
      - dvr:/dvr
      - type: bind
        source: ${RUNTIME_DIR:?}/mediamtx.yml
        target: /mediamtx.yml
        read_only: true
        bind:
          create_host_path: false
    logging: *attached-logging
    labels: *bench-labels

  nginx:
    image: ${PCBENCH_NGINX_IMAGE:?unit_restart_test.sh 가 images.json 에서 넣는다}
    network_mode: "service:mediamtx"
    depends_on: *mediamtx-dependency
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    ulimits:
      core: 0
    volumes:
      - type: bind
        source: ${PCBENCH_NGINX_CONF:?}
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
    logging: *attached-logging
    labels: *bench-labels

  sidecar:
    image: ${PCBENCH_ECHO_IMAGE:?}
    pull_policy: never
    command:
      - sidecar
      - -owner_addr=127.0.0.1:8888
      - -exit_delay=${PCBENCH_SIDECAR_EXIT_DELAY:?}
    network_mode: "service:mediamtx"
    depends_on: *mediamtx-dependency
    restart: on-failure
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      core: 0
    volumes:
      - recordings:/recordings:ro
      - hooks:/hooks:ro
      - type: bind
        source: ${RUNTIME_DIR:?}/mtx_api_pass
        target: /run/secrets/mtx_api_pass
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: journald
      options:
        tag: pokeclip-media-sidecar
    labels: *bench-labels

networks:
  default:
    labels: *bench-labels

volumes:
  recordings:
    labels: *bench-labels
  hooks:
    labels: *bench-labels
  dvr:
    labels: *bench-labels
