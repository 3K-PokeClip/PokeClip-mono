# 유닛 재기동 시험의 응답기 모드 compose — unit_restart_test.sh 사례 22 · 23
# (lib/unit_ingest_auth_cases.sh)이 scratch 로 복사해 시험 유닛의
# MEDIA_COMPOSE_FILE 로 넘긴다. 복사하는 까닭: 운영 스크립트
# (bin/ingest-auth-ip-limit.sh)가 compose 파일 옆의 ingest-auth.env 를 바꿔 쓴다.
#
# mediamtx · nginx · sidecar 는 옛 모드 시험 compose(compose.unit.yml)를 그대로
# 들인다(include — 경로는 시험 env PCBENCH_UNIT_COMPOSE). 이 파일은 응답기 자리
# 하나만 더한다. 시작 스크립트는 이 파일의 `  ingest-auth:` 줄 수(1)로 모드
# 일치를 본다.
#
# 응답기 자리의 망 칸 · 의존 · 재시작 정책 · 읽기 전용 · cap · ulimits · env_file ·
# 비밀 bind(시작 스크립트가 둔 파일 — 없으면 생성 실패) · healthcheck 간격 ·
# 로그 tag 는 prod 템플릿(compose.yml.tmpl)을 따른다. 다른 점:
#   - 이미지 · 명령: 실물 응답기 대신 nginx 핀 이미지(alpine — 셸이 있다)의
#     셸이다. 시작할 때 운영 스크립트가 기다리는 ingestauth_started 줄을
#     ip_limit 값(env_file 의 INGEST_AUTH_IP_LIMIT)과 함께 한 번 내고, TERM 에
#     0 으로 끝난다. 송출 인증은 하지 않는다(재시작 단위만 본다).
#   - healthcheck: 셸이 살아 있으면 healthy · start_interval 2s(시험 시간 단축).
#   - environment: 응답기 설정 키는 두지 않는다(셸은 읽지 않는다).
#
# 값은 시험 env 파일(유닛 EnvironmentFile)이 넣는다 — compose.unit.yml 의 값에
# 더해 PCBENCH_UNIT_COMPOSE · INGEST_AUTH_DENY_DIR.
#
# 실험 식별: 프로젝트 pcbench-edge-proxy · 라벨 com.pokeclip.bench=edge-proxy.
name: pcbench-edge-proxy

include:
  - path: ${PCBENCH_UNIT_COMPOSE:?unit_restart_test.sh 가 넣는다}

services:
  ingest-auth:
    image: ${PCBENCH_NGINX_IMAGE:?}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        trap 'exit 0' TERM INT;
        printf '{"level":"INFO","msg":"ingestauth_started","ip_limit":"%s"}\n'
        "$${INGEST_AUTH_IP_LIMIT:-}";
        while :; do sleep 1 & wait $$!; done
    user: "10003:10003"
    network_mode: "service:mediamtx"
    depends_on:
      mediamtx:
        condition: service_started
        restart: true
    restart: on-failure
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      core: 0
    env_file:
      - path: ingest-auth.env
        required: true
    volumes:
      - type: bind
        source: ${RUNTIME_DIR:?}/ingest-auth/mtx_api_pass
        target: /run/secrets/mtx_api_pass
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${RUNTIME_DIR:?}/ingest-auth/stream_key_resolve_token
        target: /run/secrets/stream_key_resolve_token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${RUNTIME_DIR:?}/ingest-auth/ingest_basic_pass
        target: /run/secrets/ingest_basic_pass
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${INGEST_AUTH_DENY_DIR:?}
        target: /etc/ingest-auth
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${RUNTIME_DIR:?}/ingest-auth/state
        target: /var/lib/ingest-auth
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "/bin/true"]
      interval: 30s
      retries: 3
      start_period: 10s
      start_interval: 2s
    logging:
      driver: journald
      options:
        tag: pokeclip-media-ingest-auth
    labels:
      com.pokeclip.bench: edge-proxy
