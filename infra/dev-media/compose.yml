# dev-media 계정별 방송 서버 (README.md 참조)
# 팀 공용 로컬 환경(docker-compose.yml · infra/compose/)과 별개다 — 이 파일은 dev-media 상자에서만 쓴다.
#
# 반영:  빌드 · 디렉터리 준비 · 렌더 · 기동 순서(응답기 healthy 뒤 MediaMTX)는 RUNBOOK 「반영」 절이 정본이다 — 맨 up -d 만 치지 않는다.
# 확인:  config 출력은 .env 의 비밀을 그대로 내므로 통째로 찍지 않는다. RUNBOOK 의 compose 명령(--env-file · -f)에 config --quiet(검증만)를 돌리고,
#        포트 · bind 는 config | grep -E '^ +(source|target|published|protocol|read_only|ipv4_address):' 로만 본다.
# ${DEMO_HOME} 은 반드시 절대경로다(render.sh 가드 1). 상대경로면 bind 가 딴 디렉토리나 named volume 이 된다.

networks:
  # MediaMTX 제어면(인증 훅 · Control API) 전용. 밖으로 나가지 않고(internal) edge 는 붙이지 않는다.
  # 대역은 상자 VPC 대역과 겹치지 않는다. 고정 주소 둘은 템플릿의 apiAddress · authHTTPAddress 와 같아야 한다.
  mtx-control:
    internal: true
    ipam:
      config:
        - subnet: 10.250.0.0/29

services:
  mediamtx:
    # 포크 판을 계정 ECR(pokeclip/mediamtx)에 둔 이미지다. 판 태그 + 다중 아치 목록 digest(amd64 · arm64)로 고정한다.
    # 레지스트리 호스트는 계정 번호가 들어 있어 저장소에 두지 않는다 — 상자 .env 의 MTX_IMAGE_REGISTRY(RUNBOOK 3절)로 받는다.
    # 비공개 저장소라 받기 전에 ECR 로그인이 필요하다(RUNBOOK R3′ — 인스턴스 역할의 ECR 읽기 권한은 1-5).
    image: ${MTX_IMAGE_REGISTRY:?}/pokeclip/mediamtx:v1.21.2-pokeclip.1@sha256:ca94c11b4f9e2ad301d8e374c726d42ed29d86724704e6604c15362305c2122a # dev-media(서버) 핀 — 서버가 필요로 할 때 서버 기준으로 올린다. 제품 핀(media/Dockerfile.mtxhook FROM — 팀 로컬)과 같을 필요는 없다(ADR-040 2026-10-12 추기)
    user: "10002:10002" # 비특권 실행 승계(ADR-039). v1.21.2-pokeclip.1 을 UID 지정으로 띄운 기동은 로컬(arm64)에서 통과(2026-10-20 호환 확인). 상자(amd64) 기동은 반영(R6) 때 다시 본다
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: UTC
    ports:
      # SRT 인제스트 — OBS 가 컨테이너에 직접 닿아야 하므로 반드시 publish 한다(빠지면 송출 전면 실패).
      - "8890:8890/udp"
      # HLS 8888 은 publish 하지 않는다 — edge(nginx)만 내부 네트워크로 접근한다(결정 1). Control API 9997 도 publish 하지 않는다.
    volumes:
      - ${DEMO_HOME}/mediamtx.demo.yml:/mediamtx.yml:ro # render.sh 산출물(root:10002 0640 — 컨테이너는 그룹 읽기만)
      - ${DEMO_HOME}/dvr:/dvr # LL-HLS 세그먼트 디스크 오프로드
    networks:
      default: {}
      mtx-control:
        ipv4_address: 10.250.0.2
    # 시작 순서만 맞춘다(응답기 먼저). 건강 조건은 걸지 않는다 — 응답기가 unhealthy 여도 MediaMTX 는 떠 있어야 한다(설계 3-8).
    depends_on:
      - ingest-auth

  # 연결마다 MediaMTX 의 HTTP 인증에 답하는 응답기 — 4C(auth)로 토큰을 풀어 그 계정의 passphrase 를 돌려준다.
  ingest-auth:
    build:
      context: ../../media
      dockerfile: Dockerfile.ingest-auth
    # 이미지의 USER(Dockerfile.ingest-auth — 10003:10003)와 같은 값을 여기서도 못박는다. 바이너리는 이미지 안에서 root 소유라
    # 이 계정이 덮어쓰지 못한다. 빌드한 이미지의 실제 User · 소유는 반영 때 RUNBOOK 이 다시 본다.
    user: "10003:10003"
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # 비root 실행이라 쓰는 권한이 없다 — 남은 기본 권한을 모두 걷는다. 로컬 실측(2026-10-17)에서
    # 이 꼴로 기동 · healthcheck 통과. 상자 기동은 반영(R5) 때 다시 본다.
    cap_drop:
      - ALL
    environment:
      INGEST_AUTH_LISTEN: "10.250.0.3:8080"
      INGEST_AUTH_CALLER_IP: "10.250.0.2"
      MTX_API_URL: "http://10.250.0.2:9997"
      MTX_API_USER: "ingest-auth"
      MTX_API_PASS: "${MTX_API_PASS:?}"
      STREAM_KEY_RESOLVE_URL: "${STREAM_KEY_RESOLVE_URL:?}"
      STREAM_KEY_RESOLVE_TOKEN: "${STREAM_KEY_RESOLVE_TOKEN:?}"
      # debug · info · warn · error. 바꾸려면 이 줄을 고치고 응답기만 다시 만든다.
      LOG_LEVEL: "info"
      # 송출자 IP별 시도 한도(on · off — 기본 on). 끄려면 .env 에 INGEST_AUTH_IP_LIMIT=off 를 두고
      # `docker compose up -d --force-recreate ingest-auth` 로 응답기를 다시 만든다 — restart 는 환경을 다시 읽지 않는다.
      # 적용값은 ingestauth_started 의 ip_limit 로 확인한다.
      INGEST_AUTH_IP_LIMIT: "${INGEST_AUTH_IP_LIMIT:-on}"
    volumes:
      # 거부 목록 — 디렉터리를 마운트한다(이름을 바꿔 끼우는 편집이 컨테이너에 닿게). 긴 꼴 bind 로 호스트 경로를 만들지 않는다 —
      # 디렉터리가 없으면 빈 디렉터리(= 거부 목록 없음)로 뜨지 않고 기동이 실패한다.
      - type: bind
        source: ${DEMO_HOME:?}/ingest-auth/deny
        target: /etc/ingest-auth
        read_only: true
        bind:
          create_host_path: false
      - ${DEMO_HOME:?}/ingest-auth/state:/var/lib/ingest-auth # 허용 연결 기록(10003:10003 0700)
    networks:
      default: {}
      mtx-control:
        ipv4_address: 10.250.0.3
    healthcheck:
      test: ["CMD", "/ingest-auth", "healthcheck"]
      interval: 30s
      retries: 3
      start_period: 10s

  edge:
    # 판 태그 + 다중 아치 목록 digest 로 고정한다 — amd64 상자 · arm64 로컬이 같은 좌표를 받는다
    # (2026-10-19 docker buildx imagetools inspect). 올릴 때는 태그와 digest 를 함께 바꾼다.
    image: nginx:1.31.7-alpine@sha256:892bb2152464f0c5d8972593a5f5afaf8054552580b699d95f8ff4af08c2d33d
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # 기본 권한을 모두 걷고 nginx 가 쓰는 셋만 돌려준다 — 마스터(root)가 임시 디렉터리를 워커
    # 계정 소유로 바꾸고(CHOWN) 워커를 nginx 계정으로 내린다(SETGID · SETUID). 8888 은 1024 위라
    # NET_BIND_SERVICE 는 필요 없다. NET_RAW 를 걷어 기본 망에서 패킷을 짜 넣는 길을 닫는다.
    # 로컬 실측(2026-10-17): CHOWN 이 없으면 마스터가 chown(client_temp) EPERM 으로 기동 실패,
    # SETGID · SETUID 가 없으면 워커가 setgid EPERM 으로 죽어 응답 없음, 셋이면 200. 상자 기동은
    # 반영(R6) 때 다시 본다.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    environment:
      TZ: UTC
    ports:
      - "8888:8888" # 외부에 열리는 유일한 TCP 포트 (SG 는 팀 IP/32 로만 허용)
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./player.html:/www/player.html:ro
      # hls.js 셀프호스팅(필수) — RUNBOOK 「반영」 절의 전제대로 ./hls.min.js 를 내려받은 뒤 기동한다(2026-08-18 실측: 동봉본 의존 폐기)
      - ./hls.min.js:/www/hls.min.js:ro
    # 기본 망에만 붙는다 — 제어망(mtx-control)에 붙이면 Control API · 응답기에 닿는다.
    networks:
      default: {}
    depends_on:
      - mediamtx
