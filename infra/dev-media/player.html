<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PokeClip 데모 — LL-HLS 1시간 되감기</title>
<script src="/hls.min.js"></script>
<style>
body{margin:0;background:#0b0b0d;color:#eee;font-family:system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:.2em 0}.sub{color:#aaa;font-size:13px;margin-bottom:10px}
video{width:100%;background:#000;border-radius:10px;aspect-ratio:16/9}
#bar{width:100%;margin:12px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{background:#222;color:#eee;border:1px solid #444;border-radius:8px;padding:10px 16px;font-size:14px;cursor:pointer}
#live.on{background:#e23;border-color:#e23}
#status{margin-left:auto;color:#bbb;font-size:14px}
#err{color:#f66;font-size:13px;margin-top:8px;min-height:1em}
</style></head><body><div class="wrap">
<h1>PokeClip 데모 — LL-HLS 1시간 되감기</h1>
<div class="sub">시크바를 끌면 그 시점 영상이 나옵니다. LIVE 버튼을 눌러야만 현재 방송으로 돌아옵니다.</div>
<video id="v" playsinline></video>
<input id="bar" type="range" min="0" max="0" step="0.1" value="0">
<div class="row">
<button id="pause">일시정지</button>
<button id="live" class="on">LIVE</button>
<button id="mute">소리 켜기</button>
<span id="status">연결 중…</span>
</div>
<div id="err"></div>
</div>
<script>
var p=new URLSearchParams(location.search).get('p'),v=document.getElementById('v'),
bar=document.getElementById('bar'),liveBtn=document.getElementById('live'),
st=document.getElementById('status'),err=document.getElementById('err'),hls,drag=false;
function fmt(s){s=Math.max(0,s|0);var h=s/3600|0,m=s%3600/60|0,x=s%60;return (h?h+':':'')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0');}
function start(){
  if(!window.Hls||!Hls.isSupported()){err.textContent='재생 엔진(hls.js)을 불러오지 못했습니다.';return;}
  hls=new Hls({lowLatencyMode:true,liveSyncDurationCount:3,liveMaxLatencyDurationCount:1e9,backBufferLength:3700});
  hls.loadSource('/'+p+'/index.m3u8');hls.attachMedia(v);
  hls.on(Hls.Events.MANIFEST_PARSED,function(){v.play().catch(function(){});});
  hls.on(Hls.Events.ERROR,function(e,d){if(d.fatal){err.textContent='재생 오류: '+d.details+' — 방송이 송출 중인지 확인';}});
}
setInterval(function(){
  if(!v.seekable||!v.seekable.length)return;
  var a=v.seekable.start(0),b=v.seekable.end(0);
  bar.min=a;bar.max=b;if(!drag)bar.value=v.currentTime;
  var behind=b-v.currentTime;
  st.textContent='되감기 '+fmt(behind)+'   축적 '+fmt(b-a)+' / 최대 1:00:00';
  liveBtn.classList.toggle('on',behind<5);
},500);
bar.addEventListener('input',function(){drag=true;v.currentTime=parseFloat(bar.value);});
bar.addEventListener('change',function(){drag=false;});
liveBtn.addEventListener('click',function(){if(hls&&isFinite(hls.liveSyncPosition))v.currentTime=hls.liveSyncPosition;else if(v.seekable.length)v.currentTime=v.seekable.end(0);});
document.getElementById('pause').addEventListener('click',function(){if(v.paused){v.play();this.textContent='일시정지';}else{v.pause();this.textContent='재생';}});
document.getElementById('mute').addEventListener('click',function(){v.muted=!v.muted;this.textContent=v.muted?'소리 켜기':'음소거';});
document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft')v.currentTime-=10;if(e.key==='ArrowRight')v.currentTime+=10;});
v.muted=true;start();
</script></body></html>
