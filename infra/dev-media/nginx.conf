server {
  listen 8888;
  location = /player.html { root /www; add_header Cache-Control "no-store"; }
  location = /hls.min.js  { root /www; add_header Cache-Control "no-store"; default_type application/javascript; }
  location / {
    proxy_pass http://mediamtx:8888;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 90s;
    proxy_set_header Host $host;
  }
}
