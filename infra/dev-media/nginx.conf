# 데모 전용 엣지 — 8888 단일 오리진 (기한부: 2026-08-24 만료, README.md 참조)
#
# nginx 를 MediaMTX "옆"이 아니라 "앞"에 둔다: 재생 페이지와 스트림이 같은 오리진 8888 로 나가므로
# 노출 포트(SG 규칙)도 점검 지점도 하나뿐이다(결정 1). MediaMTX 의 HLS 8888 은 컨테이너 밖으로 열지 않는다.
#
# 마운트 위치: /etc/nginx/conf.d/default.conf (이미지 기본 server 블록을 덮어쓴다)

server {
    listen 8888;

    # 재생 페이지 — 이 파일 하나만 정적으로 서빙한다
    location = /player.html {
        root /www;
        add_header Cache-Control no-store always;
    }

    # hls.js 폴백 자리 — 평시에는 비어 있어 404 다(정상).
    # MediaMTX 동봉본 /{path}/hls.min.js 가 안 나올 때만 RUNBOOK "hls.js 폴백" 절차로 채운다.
    location = /hls.min.js {
        root /www;
    }

    # 나머지 전부 MediaMTX — 매니페스트·부분 세그먼트·동봉 hls.js
    location / {
        # 업스트림을 부팅 시점에 한 번 해석하지 않고 런타임에 재해석한다.
        # 스택 재기동 시 edge 가 mediamtx 보다 먼저 뜨면 "host not found in upstream" 으로 nginx 가 죽는데,
        # Docker 내장 DNS(127.0.0.11)를 resolver 로 두고 변수 proxy_pass 를 쓰면 그 창을 넘긴다.
        resolver 127.0.0.11 valid=10s;
        set $up http://mediamtx:8888;
        proxy_pass $up;

        # LL-HLS 블로킹 플레이리스트 요청(long-poll)을 중간에서 끊지 않기 위한 3줄
        proxy_http_version 1.1;   # 기본 1.0 은 keep-alive/청크 스트리밍이 끊긴다
        proxy_buffering off;      # 부분 세그먼트를 모아 두지 않고 즉시 흘려보낸다
        proxy_read_timeout 90s;   # 블로킹 리로드 홀드 시간보다 길게

        proxy_set_header Host $host;

        # 상비 처방: /{path}/ 의 302 Location 에 업스트림 주소(http://mediamtx:8888/)가 새어 나와
        # 브라우저가 리다이렉트를 못 따라가면 아래 한 줄을 켠다 (리허설 302 실패 시 1순위 처방, 결정 1)
        # proxy_redirect http://mediamtx:8888/ /;
    }
}
