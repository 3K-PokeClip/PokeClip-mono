# PokeClip 로컬 개발 환경 (M1 1단계 / 이슈 #1 "로컬 docker-compose")
# 사용법: cp .env.example .env && docker compose up -d   (상세: docs/dev-environment.md)
# 버전 정책: 최신 메이저 -1 고정 (PG 18→17, Redis 8→7.4). MediaMTX는 07-25 스파이크 검증 버전 고정.
name: pokeclip

services:
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?cp .env.example .env 먼저 실행하세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?cp .env.example .env 먼저 실행하세요}
      POSTGRES_DB: ${POSTGRES_DB:?cp .env.example .env 먼저 실행하세요}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Media Origin 자리 — 수신(SRT)·LL-HLS 먹싱·DVR. 사이드카·합성 레이어는 M1 2단계에서 추가.
  media:
    # 표준 이미지는 scratch라 셸·curl이 없다(실측). 훅이 부를 정적 바이너리를 한 층 얹기
    # 위해서만 build로 바꾼다 — 버전 pin은 media/Dockerfile.mtxhook의 FROM이 담당한다.
    build:
      context: ./media
      dockerfile: Dockerfile.mtxhook
    # 실행 계정의 정본은 media/Dockerfile.mtxhook 의 USER(10002:10002)다.
    # 여기에 user: 를 또 적지 않는다 — 같은 값이 두 곳에 있으면 한쪽만 바뀐다.
    security_opt:
      - no-new-privileges:true # ADR-031: 비특권 전환과 한 덩어리일 때만 의미가 있다
                               # K8s 등가물 = securityContext.allowPrivilegeEscalation: false
    environment:
      TZ: UTC # 녹화 파일명에 박히는 시각을 UTC로 고정한다 (사이드카가 파일명에서 start_wall_utc를 읽는다)
    ports:
      - "8890:8890/udp" # SRT 인제스트 (OBS)
      - "1935:1935" # RTMP 인제스트 (로컬 ffmpeg 테스트용 — homebrew ffmpeg은 SRT 미포함)
      - "8888:8888" # LL-HLS 재생
      # Control API(9997)는 **일부러 공개하지 않는다** (POK-195). 사이드카가 compose 내부망에서만
      # 부르며, 인증 항목이 자격증명 없이 api 권한을 열어 두므로 호스트 노출은 그대로 개방이 된다.
    volumes:
      - ./infra/compose/mediamtx.yml:/mediamtx.yml:ro
      # 아래 세 볼륨에 long syntax 의 복사 금지 옵션(volume.nocopy: true)을 붙이지 마라.
      # 붙이는 순간 이미지에 심은 소유권 복사가 끊겨 **비root 쓰기가 조용히 실패**한다.
      # docker-compose.override.yml 에 넣어도 결과는 같지만 그쪽은 gitignore 라
      # 계약 테스트가 잡지 못한다 — override 에도 넣지 마라.
      - dvr:/dvr
      - recordings:/recordings
      - hooks:/hooks # 훅 이벤트 스풀(append-only). 쓰는 것은 이 컨테이너뿐이다

  # 세그먼트 인덱서 사이드카 (M1 2단계 / POK-29) — recordings를 감시해 stream_segments에 한 줄씩 기록.
  # 인식하는 환경변수 전수 목록은 media/README.md에 있다. 여기서는 기본값과 다른 것만 적는다.
  segment-indexer:
    build: ./media
    depends_on:
      postgres:
        condition: service_healthy # 표가 준비된 뒤에 붙는다
      media:
        condition: service_started # media는 healthcheck가 없으므로 조건을 명시해 해석 차이를 막는다
    restart: unless-stopped # DB 사망 시 죽고 재기동해 Scan으로 복구한다 (진실원은 파일)
    security_opt:
      - no-new-privileges:true # 컨테이너 안에서 권한을 되찾는 경로를 막는다
    volumes:
      # :ro — 사이드카가 파일을 지우거나 고치는 것을 운영체제 수준에서 막는다. 삭제는 janitor 책임.
      - recordings:/recordings:ro
      # :ro — 사이드카는 스풀을 읽기만 한다. 읽은 위치를 파일로 남기지 않으므로 rw가 필요 없다.
      - hooks:/hooks:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?cp .env.example .env 먼저 실행하세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?cp .env.example .env 먼저 실행하세요}
      POSTGRES_DB: ${POSTGRES_DB:?cp .env.example .env 먼저 실행하세요}
      POSTGRES_HOST: postgres
      SEGMENT_ROOT: /recordings
      TZ: UTC # 로그 시각과 mtime 해석을 UTC로 고정 (저장 값은 코드가 UTC로 강제한다)
      ENSURE_SCHEMA: "true" # 부팅 시 정본 DDL 보장(1번 소유, ADR-0001). RDS/마이그레이션 도구 도입 시 끈다
      # 훅 스풀 경로. **빈 값이면 훅 어댑터를 아예 기동하지 않는다** = 즉시 롤백 스위치
      # (사이드카만 재기동하면 되고 MediaMTX는 건드리지 않는다. 자세히는 media/README.md)
      HOOK_SPOOL_PATH: /hooks/events.jsonl
      # MediaMTX Control API 관측(POK-195). **빈 값이면 폴러를 아예 기동하지 않는다** = 즉시
      # 롤백 스위치 — 관측이 사라지면 스캔 유입(ⓐ2)의 되감기 컷오프 주조만 멈춘다. 워처·훅
      # 유입(ⓐ1) 주조는 계속되며 그것은 REWIND_SEED_ENABLED 로만 멈춘다. 인덱싱·업로드는 그대로 돈다.
      # 9997은 호스트에 공개하지 않으므로 이 주소는 compose 내부망에서만 유효하다.
      MTX_API_URL: http://media:9997

  # 정적 세그먼트 스텁 (M1 1-2) — 2번 플레이어 개발용. 먼저 infra/compose/stub/gen-segments.sh 1회 실행.
  media-stub:
    image: nginx:1-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/compose/stub/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/compose/stub/data:/data:ro

volumes:
  pgdata:
  dvr:
  recordings:
  hooks:
