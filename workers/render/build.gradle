plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.pokeclip'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    // Boot BOM은 AWS SDK를 관리하지 않는다. services/clip과 같은 판을 박는다.
    imports { mavenBom 'software.amazon.awssdk:bom:2.46.7' }
}

dependencies {
    // 웹 서버가 없는 일꾼이다. 사람이 부르는 문이 없고, 줄에서 꺼내 일하고 clip에 보고만 한다.
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-jackson'
    // RestClient.Builder 자동설정과 spring.http.clients.* 시한 바인딩이 이 스타터에서 온다(clip과 같은 이유).
    implementation 'org.springframework.boot:spring-boot-starter-restclient'

    implementation 'software.amazon.awssdk:sqs'
    implementation 'software.amazon.awssdk:s3'
    // SDK가 apache5를 runtime으로 딸려와 SPI 후보가 둘이 된다. 클라이언트를 만드는 자리마다 이쪽을 명시한다.
    implementation 'software.amazon.awssdk:url-connection-client'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:testcontainers-localstack'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// SharedTimelineCases가 services의 공유 시험 표를 이 폴더 기준 상대 경로로 읽는다(PDT 설계 r7 3.5 · r6 3.4). 입력으로
// 알리지 않으면 표만 고친 판에서 시험이 UP-TO-DATE로 건너뛰어져 낡은 표가 초록으로 남는다(services/clip의 README 입력과 같은 이유).
tasks.named('test') {
    useJUnitPlatform()
    inputs.file('../../services/ledger-timeline/src/test/resources/ledger-timeline-cases.json')
            .withPropertyName('ledgerTimelineCases')
            .withPathSensitivity(PathSensitivity.RELATIVE)
}
