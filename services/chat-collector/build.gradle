plugins {
    id 'java'
    id 'org.springframework.boot'
}

dependencyManagement {
    // Boot 4.1.0 BOM은 AWS SDK를 관리하지 않는다 — 여기서 한 번만 박는다.
    imports { mavenBom 'software.amazon.awssdk:bom:2.46.7' }
}

dependencies {

    // 채팅 원본 1분 파일을 S3에 올린다(POK-116). s3가 runtime으로 끌어오는 HTTP 클라이언트는
    // Apache 5(apache-client 4가 아니다) — S3Clients가 시한을 박으려면 컴파일에서 보여야 해서 명시.
    // 이 의존성이 httpclient5를 클래스패스에 올리는 순간 Boot가 RestClient 스택을 바꾼다 —
    // application.yml의 spring.http.clients.imperative.factory=jdk가 그것을 막는다.
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:apache5-client'

    // 1번 Media가 넣는 방송 생명주기 편지를 꺼낸다(계약9, ADR-016).
    // url-connection-client를 같이 넣지 않는다 — 위 apache5-client가 이미 있어 SDK HTTP
    // 구현이 둘이 되고, 빌더가 명시를 빠뜨리면 "Multiple HTTP implementations"로 죽는다.
    // SqsClient는 S3Clients와 같이 Apache5HttpClient를 명시한다.
    implementation 'software.amazon.awssdk:sqs'

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // RestClient 클래스 자체는 webmvc가 끌어오는 spring-web에 있지만,
    // RestClient.Builder 자동설정과 spring.http.clients.* 타임아웃 바인딩은
    // 이 스타터에서 온다. 세션 URL이 30초에 만료되므로 타임아웃은 선택이 아니다.
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    // starter는 flyway-core만 가져온다. PostgreSQL 방언 모듈을 직접 넣지 않으면
    // 부팅 시 "Unsupported Database: PostgreSQL"로 죽는다.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    // 가짜 S3. 2.x 좌표다 — 1.x의 org.testcontainers:localstack가 아니다.
    testImplementation 'org.testcontainers:testcontainers-localstack'

    // LogCaptor. 요약 한 줄이 실제로 찍히는지, 그리고 어느 레벨에서도 본문이
    // 안 새는지를 로그에서 직접 확인한다(auth의 SecretLeakTest와 같은 방식).
    testImplementation testFixtures(project(':web-support'))

    // 가짜 치지직 서버 전용. 운영 아티팩트에는 안 들어간다.
    // 임베디드 톰캣의 WsServerContainer 초기화는 spring-boot-tomcat이 이미 하므로
    // 여기서 새로 들어오는 것은 spring-websocket(스프링 핸들러 API)뿐이다.
    testImplementation 'org.springframework.boot:spring-boot-starter-websocket'
}

tasks.named('test') {
    // DocumentedEnvVarsTest가 이 파일을 읽는다. 선언하지 않으면 Gradle이 입력으로 안 세고,
    // README만 고친 실행에서 test 태스크가 UP-TO-DATE로 통째로 건너뛴다 —
    // 문서에서 환경변수를 지워도 초록이다(2026-08-19에 결함 주입으로 실측하다 드러났다).
    // 반대 방향(yml에 변수 추가)은 processResources가 이미 입력이라 원래 다시 돈다.
    inputs.file(rootProject.file('README.md'))
            .withPropertyName('servicesReadme')
            .withPathSensitivity(PathSensitivity.NONE)

    // pgjdbc는 socketTimeout으로 끊긴 배치의 뒷정리에서 `assert false`를 밟는다
    // (BatchResultHandler.isAutoCommit — 닫힌 커넥션의 getAutoCommit, 42.7.11 실측).
    // Gradle 테스트 JVM은 -ea가 기본이라 운영에서 PSQLException(08006)으로 오는
    // 것이 테스트에서만 AssertionError로 바뀌어 ChatPersister의 복원 경로를 안 탄다.
    // 드라이버 패키지의 단언만 꺼서 운영과 같은 예외 타입을 잰다.
    jvmArgs '-da:org.postgresql...'
}
