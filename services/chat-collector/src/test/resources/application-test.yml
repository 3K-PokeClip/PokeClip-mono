# 테스트 고정값. 시크릿이 아니라 @NotBlank를 만족시키기 위한 것이다.
# 가짜 서버 포트는 런타임에 정해지므로 base-url은 테스트가 직접 넘긴다.
pokeclip:
  chzzk:
    enabled: false
    access-token: test-only-token
    base-url: http://localhost:0
    establish-timeout: 5s
    # 스프링이 바인딩하는 빈에도 값이 있어야 한다. 여기가 비면 @NotNull이
    # 부팅을 막고, 안 막았다면 재연결 루프가 이 값을 읽는 날 배선 테스트가
    # 통째로 NPE로 죽는다. 러너를 직접 만드는 테스트가 넘기는 값과 같게 둔다 —
    # 실서버 기본값(35s·120s)을 그대로 쓰면 테스트가 그만큼 잔다.
    reconnect-first-delay: 50ms
    reconnect-max-delay: 1s
    # 아카이브는 기본 꺼짐(bucket 빈 값). region이 비면 @NotBlank가 모든 스프링 컨텍스트를
    # 막으므로 여기서도 값을 준다 — 배선 검사(ArchiveWiringTest)가 @SpringBootTest(properties=…)로 켠다.
    # LocalStack 검사는 archive 설정을 스프링에 안 맡기고 LocalStackFixture.propertiesFor로 직접 만든다
    # (그 검사들도 스프링 컨텍스트는 띄운다 — 거기서는 이 기본값대로 아카이브가 꺼져 있다).
    archive:
      bucket: ""
      region: ap-northeast-2
      endpoint: ""
      force-path-style: false
      pending-max: 60
      buffer-capacity: 10000
  broadcast:
    # 검사 중에는 배선만 재고 실제로는 안 돌린다 — 첫 틱도 이만큼 뒤다(initialDelay = interval).
    # 돌면 컨텍스트 수십 개가 각자 표를 치워 EndedStreamStoreTest가 밀어 넣은 오래된 메모를
    # 지운다(그 검사는 created_at을 과거로 직접 밀어 넣는다). EndedStreamSweeperTest가 이 값을 단언한다.
    ended-sweep-interval: PT24H
    ended-retention: PT24H
