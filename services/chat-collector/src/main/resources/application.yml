spring:
  application:
    name: pokeclip-chat-collector
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:pokeclip}
    username: ${POSTGRES_USER:pokeclip}
    password: ${POSTGRES_PASSWORD:change-me-local-only}
    hikari:
      data-source-properties:
        # 반개방 스톨(연결은 살았는데 응답이 안 옴)을 끊는 유일한 시한이다(초).
        # 없으면 동기 batchUpdate가 영영 매달려 단일 저장 스레드가 죽고, 버퍼는
        # 상한에 닿아 드롭만 세며 DB가 회복돼도 못 빠져나온다(PR #55 P1).
        # 셋 중 이것만 끊는다 — 2026-08-15 실측: JdbcTemplate queryTimeout은
        # 취소를 서버에 보내는 방식이라 답 없는 상대에게 무력하고, HikariCP
        # connection-timeout은 풀에서 빌리는 대기 시한이라 이미 빌린 커넥션의
        # read를 못 끊는다(둘 다 20초 넘게 매달림). DatasourceTimeoutTest가 이
        # 값이 실제로 걸리는지를 행동으로 잰다 — 값 단언이 아니라.
        # 이 DataSource의 모든 문장에 걸린다 — 10초를 넘기는 마이그레이션(큰 표
        # 인덱스)을 쓰는 날 이 값을 다시 본다. 저장 배치 하나가 최대 이만큼 걸릴
        # 수 있어 종료 시 마지막 flush 대기 5초 안에는 못 돌아온다(적재 예산 주석).
        socketTimeout: 10
  flyway:
    enabled: true
    # 네 서버가 DB 하나를 공유한다. 기본 이력 테이블 이름을 쓰면 나중에 뜬 쪽이
    # 남의 이력을 자기 것으로 읽고 부팅에 실패한다. 번호 대역은 V3xx (chat).
    table: flyway_schema_history_chat
    # auth가 먼저 마이그레이션한 DB에서는 public이 비어 있지 않은데 우리 이력
    # 테이블은 없다 — 이 설정이 없으면 첫 부팅이 "Found non-empty schema(s)
    # ... but no schema history table"로 죽는다 (verifier 실물 부팅 실측).
    baseline-on-migrate: true
    # 기본 1이면 V1 이하가 스킵된다. 우리 대역은 V3xx라 실질 영향은 없지만,
    # "아무것도 스킵하지 않는다"를 정확히 말하려면 0이다.
    baseline-version: 0
  http:
    clients:
      # 복수형이다. 단수형 spring.http.client.*는 4.0.0부터 아무것도 바인딩하지
      # 않고, 오타를 내도 에러가 없어 타임아웃이 조용히 사라진다.
      # 세션 URL이 30초에 만료되므로 여기가 비면 수립이 영영 매달린다.
      connect-timeout: 2s
      read-timeout: 5s

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # 이게 없으면 Boot 기본값 never가 걸려 detail이 HTTP 응답에서 잘린다.
      # CollectorHealth가 withDetail("status", …)·withDetail("reason", …)를 아무리
      # 잘 만들어도 밖에서는 {"status":"UP"}만 보이고, 그러면 "서버는 떴는데
      # 수집은 죽은" 상태를 구분할 수 없다 — 이 카드가 막으려는 실패 그 자체다.
      #
      # 지금 detail에 담기는 것은 상태 이름과 StopReason 열거값뿐이라 비밀이 없다.
      # 비밀이 담기는 detail을 추가하는 날 이 줄을 다시 봐야 한다.
      show-details: always

logging:
  level:
    # auth와 같은 방어선. DEBUG로 켜면 나가는 요청 본문이 통째로 찍힌다.
    # 구체 로거 레벨이 root보다 우선하므로 LOGGING_LEVEL_ROOT=debug로도 안 뚫린다.
    org.springframework.web: info

pokeclip:
  chzzk:
    # 기본이 꺼짐이다. 켜져 있으면 CI·남의 로컬이 뜰 때마다 붙으려 하고
    # 연결 상한 3개를 말없이 먹는다. 실측할 때만 프로파일 local에서 켠다.
    enabled: ${CHZZK_ENABLED:false}
    # 기본값을 빈 문자열로 두고 @NotBlank로 잡는다(auth와 같은 규칙).
    # 안 주면 리터럴 "${CHZZK_ACCESS_TOKEN}"이 바인딩돼 서버는 뜨고 수집만 실패한다.
    access-token: ${CHZZK_ACCESS_TOKEN:}
    base-url: https://openapi.chzzk.naver.com
    # 세션 URL 30초 만료의 절반. 만료 탓인지 우리가 느린 건지가 구분된다.
    establish-timeout: 15s
    # 재시도 간격. 둘 다 2026-08-08 실서버 실측으로 정했다.
    #
    # 첫 간격이 1초인 근거: 발급만 하고 안 붙은 세션은 연결 자리를 안 먹는다.
    # 발급 3회를 쌓아 둔 채 4회째로 실제 접속했더니 connected가 285ms에 왔다.
    # 즉 재시도가 스스로 자리를 태우지 않으므로 짧게 잡아도 된다.
    #
    # 상한이 60초인 근거: 서버가 자리를 놓아주는 시한(T)이 우아한 종료 20초,
    # 급사 5초, 네트워크 단절은 미측정이나 이론상 85초(pingInterval+pingTimeout)다.
    # 최악값으로 잡아도 T/상한 = 85/60 = 1.4로, 상시 점유가 1개 남짓이라
    # 상한 3개에 닿지 않는다.
    #
    # 세션 목록은 "발급"이 아니라 "연결"을 색인한다. 발급만 한 세션은 목록에
    # 아예 안 나오므로, 목록으로는 이 값을 정할 수 없다 — 붙어 봐야 안다.
    reconnect-first-delay: ${CHZZK_RECONNECT_FIRST_DELAY:1s}
    reconnect-max-delay: ${CHZZK_RECONNECT_MAX_DELAY:60s}
