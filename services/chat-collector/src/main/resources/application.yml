spring:
  application:
    name: pokeclip-chat-collector
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:pokeclip}
    username: ${POSTGRES_USER:pokeclip}
    password: ${POSTGRES_PASSWORD:change-me-local-only}
    hikari:
      data-source-properties:
        # 반개방 스톨(연결은 살았는데 응답이 안 옴)을 끊는 유일한 시한이다(초).
        # 없으면 동기 batchUpdate가 영영 매달려 단일 저장 스레드가 죽고, 버퍼는
        # 상한에 닿아 드롭만 세며 DB가 회복돼도 못 빠져나온다(PR #55 P1).
        # 셋 중 이것만 끊는다 — 2026-08-15 실측: JdbcTemplate queryTimeout은
        # 취소를 서버에 보내는 방식이라 답 없는 상대에게 무력하고, HikariCP
        # connection-timeout은 풀에서 빌리는 대기 시한이라 이미 빌린 커넥션의
        # read를 못 끊는다(둘 다 20초 넘게 매달림). DatasourceTimeoutTest가 이
        # 값이 실제로 걸리는지를 행동으로 잰다 — 값 단언이 아니라.
        # 이 DataSource의 모든 문장에 걸린다 — 10초를 넘기는 마이그레이션(큰 표
        # 인덱스)을 쓰는 날 이 값을 다시 본다. 저장 배치 하나가 최대 이만큼 걸릴
        # 수 있어 종료 시 마지막 flush 대기 5초 안에는 못 돌아온다(적재 예산 주석).
        socketTimeout: 10
  flyway:
    enabled: true
    # 네 서버가 DB 하나를 공유한다. 기본 이력 테이블 이름을 쓰면 나중에 뜬 쪽이
    # 남의 이력을 자기 것으로 읽고 부팅에 실패한다. 번호 대역은 V3xx (chat).
    table: flyway_schema_history_chat
    # auth가 먼저 마이그레이션한 DB에서는 public이 비어 있지 않은데 우리 이력
    # 테이블은 없다 — 이 설정이 없으면 첫 부팅이 "Found non-empty schema(s)
    # ... but no schema history table"로 죽는다 (verifier 실물 부팅 실측).
    baseline-on-migrate: true
    # 기본 1이면 V1 이하가 스킵된다. 우리 대역은 V3xx라 실질 영향은 없지만,
    # "아무것도 스킵하지 않는다"를 정확히 말하려면 0이다.
    baseline-version: 0
  http:
    clients:
      # 복수형이다. 단수형 spring.http.client.*는 4.0.0부터 아무것도 바인딩하지
      # 않고, 오타를 내도 에러가 없어 타임아웃이 조용히 사라진다.
      # 세션 URL이 30초에 만료되므로 여기가 비면 수립이 영영 매달린다.
      connect-timeout: 2s
      read-timeout: 5s
      # AWS SDK가 끌어오는 httpclient5가 클래스패스에 있으면 Boot가 RestClient를 Apache HC5로 바꾼다
      # (2026-08-16 실측: JdkClientHttpRequestFactory → HttpComponentsClientHttpRequestFactory).
      # 치지직 REST(세션 발급·구독·반납)는 지금까지 재고 정한 JDK 스택 그대로 둔다 — 이 줄이 없으면
      # 오류 없이 바뀌고, 재연결·종료 예산 산수의 근거(접속 2초·읽기 5초가 어느 층에서 끊는가)가
      # 통째로 다시 재야 하는 것이 된다. RestClient.create() 함정과 같은 부류다. 단수형
      # spring.http.client.factory는 deprecated 별칭, spring.http.clients.factory는 없다(실측).
      # CollectorConfigTest가 구현체를 단언한다.
      imperative:
        factory: jdk

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # 이게 없으면 Boot 기본값 never가 걸려 detail이 HTTP 응답에서 잘린다.
      # CollectorHealth가 withDetail("status", …)·withDetail("reason", …)를 아무리
      # 잘 만들어도 밖에서는 {"status":"UP"}만 보이고, 그러면 "서버는 떴는데
      # 수집은 죽은" 상태를 구분할 수 없다 — 이 카드가 막으려는 실패 그 자체다.
      #
      # 지금 detail에 담기는 것은 상태 이름과 StopReason 열거값뿐이라 비밀이 없다.
      # 비밀이 담기는 detail을 추가하는 날 이 줄을 다시 봐야 한다.
      show-details: always

logging:
  level:
    # auth와 같은 방어선. DEBUG로 켜면 나가는 요청 본문이 통째로 찍힌다.
    # 구체 로거 레벨이 root보다 우선하므로 LOGGING_LEVEL_ROOT=debug로도 안 뚫린다.
    org.springframework.web: info
    # 채팅 본문·sender_channel_id가 나가는 두 번째 길. TRACE로 켜면
    # org.springframework.jdbc.core.StatementCreatorUtils가 배치의 바인딩 값을
    # "Setting SQL statement parameter value: ... parameter value [본문]"으로 찍고,
    # pgjdbc(org.postgresql.core.v3.QueryExecutorImpl, JUL→SLF4J 브릿지로 온다)가
    # "FE=> Bind(... $3=<('본문')> ...)"로 여섯 파라미터를 통째로 찍는다
    # (2026-08-15 실측, Spring 7·pgjdbc 42.7.11). 위와 같은 이유로 여기 박는다 —
    # 구체 로거 레벨이 root보다 우선하므로 LOGGING_LEVEL_ROOT=trace로 내려도
    # 이 둘은 info다. ChatLogLeakTest가 root를 TRACE로 올려 놓고 적재를 돌려
    # 이 두 줄이 실제로 막는지를 행동으로 잰다 — 지우면 그 검사가 빨간불이다.
    org.springframework.jdbc: info
    org.postgresql: info
    # 채팅 본문이 나가는 세 번째 길 — S3 PUT 본문. AWS SDK 2.46.7의 HTTP 클라이언트는 Apache 5이고
    # org.apache.hc.client5.http.wire(본문 전체)·.headers(Authorization 값)가 DEBUG에 찍는다
    # (plan-critic 실측 2026-08-16: wire TRACE 35이벤트에 본문·Authorization 둘 다 유출, headers는 Authorization만).
    # netty는 async 클라이언트용이지만 딸려 오므로 같이 막는다. software.amazon.awssdk.request의
    # DEBUG는 헤더 키만 찍어 안전하지만 상위 계층 DEBUG가 서명 canonical request를 대량으로 찍어
    # 통째로 info다. JDBC 로거 둘과 같은 이유로 여기 박는다 — root TRACE로도 안 뚫린다.
    # ArchiveLogLeakTest가 root를 TRACE로 올린 채 아카이브를 돌려 이 세 줄이 실제로 막는지 잰다.
    software.amazon.awssdk: info
    org.apache.hc.client5.http: info
    io.netty: info
    # 네 번째 길 — 이번엔 들어오는 요청이다. 위 다섯 줄은 전부 우리가 밖으로 내보내는 길을
    # 막은 것이고, 들어오는 HTTP는 POK-128 이전에 컨트롤러가 0개라 막을 면적 자체가 없었다.
    # 수집 상태 창구가 그 면적을 열었다 — clip이 X-Internal-Token 헤더에 내부 토큰을 실어 보낸다.
    # root를 TRACE로 내리면 톰캣 org.apache.coyote.http11.Http11InputBuffer가 받은 바이트를
    # "Received [GET /internal/... X-Internal-Token: <값> ...]"로 통째로 찍는다
    # (2026-08-22 실측: root INFO 0건·DEBUG 0건·TRACE 1건. 톰캣이 JUL FINER로 찍어
    # 브릿지가 logback DEBUG로 번역하므로 root=DEBUG에서는 안 보인다 — 조건은 root=TRACE 하나다).
    # 새는 값이 auth와 공유하는 INTERNAL_API_TOKEN이라 채팅 본문보다 파급이 크고, 사람이 TRACE를
    # 켜는 순간은 정확히 이 창구를 디버깅할 때다. 위 다섯 줄과 같은 이유로 여기 박는다 —
    # 구체 로거 레벨이 root보다 우선한다. ChatCollectionEndpointTest의
    # 창구를_쳐도_내부_토큰이_root_TRACE에서_로그에_안_남는다가 이 줄이 실제로 막는지를 행동으로 잰다.
    org.apache.coyote: info

pokeclip:
  chzzk:
    # 편지 없이 설정에 적힌 토큰 하나로 한 채널만 붙이는 옛 경로다. 실측·디버깅용으로
    # 남긴다 — 운영에서는 꺼 두고 아래 broadcast.intake의 방송 편지로 붙는다.
    # 켜져 있으면 CI·남의 로컬이 뜰 때마다 붙으려 하고 연결 상한 3개를 말없이 먹는다.
    #
    # 이것과 broadcast.intake.enabled를 같이 켜면 부팅이 거부된다 — 옛 경로 세션의
    # 영구 정지(REVOKED·401·403)가 프로세스를 exit 1로 내려 편지로 연 세션 전부를
    # 끊고, 그 방송들을 되살릴 STARTED 편지는 이미 소비돼 큐에 없다.
    enabled: ${CHZZK_ENABLED:false}
    # 기본값을 빈 문자열로 두고 @NotBlank로 잡는다(auth와 같은 규칙).
    # 안 주면 리터럴 "${CHZZK_ACCESS_TOKEN}"이 바인딩돼 서버는 뜨고 수집만 실패한다.
    access-token: ${CHZZK_ACCESS_TOKEN:}
    base-url: https://openapi.chzzk.naver.com
    # 세션 URL 30초 만료의 절반. 만료 탓인지 우리가 느린 건지가 구분된다.
    establish-timeout: 15s
    # 재시도 간격. 둘 다 2026-08-08 실서버 실측으로 정했다.
    #
    # 첫 간격이 1초인 근거: 발급만 하고 안 붙은 세션은 연결 자리를 안 먹는다.
    # 발급 3회를 쌓아 둔 채 4회째로 실제 접속했더니 connected가 285ms에 왔다.
    # 즉 재시도가 스스로 자리를 태우지 않으므로 짧게 잡아도 된다.
    #
    # 상한이 60초인 근거: 서버가 자리를 놓아주는 시한(T)이 우아한 종료 20초,
    # 급사 5초, 네트워크 단절은 미측정이나 이론상 85초(pingInterval+pingTimeout)다.
    # 최악값으로 잡아도 T/상한 = 85/60 = 1.4로, 상시 점유가 1개 남짓이라
    # 상한 3개에 닿지 않는다.
    #
    # 세션 목록은 "발급"이 아니라 "연결"을 색인한다. 발급만 한 세션은 목록에
    # 아예 안 나오므로, 목록으로는 이 값을 정할 수 없다 — 붙어 봐야 안다.
    reconnect-first-delay: ${CHZZK_RECONNECT_FIRST_DELAY:1s}
    reconnect-max-delay: ${CHZZK_RECONNECT_MAX_DELAY:60s}
    archive:
      # 창고 이름이 비면 아카이브가 통째로 꺼진다(1번 media의 S3_BUCKET 관례). CI·팀원 로컬 기본.
      bucket: ${S3_BUCKET:}
      region: ${AWS_REGION:ap-northeast-2}
      # 비면 진짜 AWS. LocalStack·MinIO 등 호환 스토리지 주소(scheme+host+port).
      endpoint: ${S3_ENDPOINT:}
      force-path-style: ${S3_FORCE_PATH_STYLE:false}
      # 못 올린 1분 파일 대기 줄 상한. 넘치면 오래된 것부터 버리고 센다(droppedObjects/droppedMessages).
      pending-max: ${CHAT_ARCHIVE_PENDING_MAX:60}
      # 수신→아카이브 바구니 상한(채팅 수). DB 바구니와 같은 1만. 넘치면 오래된 것부터(archiveBufferDropped).
      buffer-capacity: ${CHAT_ARCHIVE_BUFFER_MAX:10000}
  broadcast:
    # 메모 치우기 주기. 하루에 한 번이면 충분하지만, 프로세스가 하루를 못 살면
    # 한 번도 안 도므로 짧게 잡는다 — 지울 것이 없으면 DELETE 한 번이라 싸다.
    # initialDelay도 같은 값이다: fixedDelay의 기본 initialDelay는 0이라
    # 컨텍스트가 뜨자마자 DELETE가 나가고 부팅과 겹친다(auth 스케줄러도 같은 이유).
    ended-sweep-interval: ${BROADCAST_ENDED_SWEEP_INTERVAL:PT1H}
    # 메모 보관 기간. ADR-016의 TTL 24h.
    ended-retention: ${BROADCAST_ENDED_RETENTION:PT24H}
    intake:
      # 운영의 시작 경로다. 켜면 이 큐의 방송 편지가 세션을 열고 닫는다.
      # 기본이 꺼짐이다. 켜져 있으면 CI·남의 로컬이 뜰 때마다 큐를 두드린다.
      # 큐 주소가 비었다고 저절로 꺼지지 않는다 — "일부러 안 켬"과 "설정을 깜빡함"이
      # 똑같이 보이면 안 되므로, 켜졌는데 주소가 없으면 부팅이 실패한다.
      #
      # 켜면 pokeclip.link.*(auth 주소·내부 토큰)가 실제로 쓰인다 — 그 둘이 비면
      # 부팅이 죽는다. 꺼져 있으면 열쇠를 물을 일이 없어 아예 안 만든다.
      enabled: ${BROADCAST_INTAKE_ENABLED:false}
      queue-url: ${BROADCAST_QUEUE_URL:}
      region: ${AWS_REGION:ap-northeast-2}
      # 비면 진짜 AWS. LocalStack 주소(scheme+host+port)를 줄 수 있다.
      endpoint: ${BROADCAST_QUEUE_ENDPOINT:}
      # SQS 상한이 20초다. 넘기면 호출이 거부되는데 부팅은 성공한다 —
      # 그래서 IntakeProperties가 부팅에서 막는다.
      wait-time: ${BROADCAST_QUEUE_WAIT:20s}
      # SQS가 한 번에 주는 최대치가 10이다.
      max-messages: ${BROADCAST_QUEUE_MAX_MESSAGES:10}
  link:
    # auth의 내부 API 주소(8082). 컨테이너 안에서는 호스트가 서비스 이름이다.
    auth-base-url: ${AUTH_BASE_URL:http://localhost:8082}
    # auth의 /internal/** 체인이 X-Internal-Token으로 보는 값. 기본값을 빈 문자열로 두고
    # ChzzkLinkClient 생성자에서 잡는다 — 안 주면 리터럴 "${INTERNAL_API_TOKEN}"이 바인딩돼
    # 서버는 뜨고 열쇠 조회만 전부 401이 되며, 401은 재시도 갈래라 편지가 큐에서 영원히 돈다.
    internal-token: ${INTERNAL_API_TOKEN:}
  sync:
    # 채팅 시각에서 빼는 보정값(ms)이다. 한 항이 아니라 합이다 —
    # (방송 지연 + 시청자 반응 지연 + 전달 지연) − 우리 인제스트 지연.
    #
    # 여기에 치지직 시계와 이 기계 시계의 차이까지 섞여 있고 그 차이는 고정이 아니다:
    # 같은 코드로 잰 전달 지연이 2026-08-05에 +175ms, 08-15에 −39~−70ms였다.
    # 그래서 부호를 미리 못 박아 음수를 허용하고, 기계·환경이 바뀌면 다시 잰다.
    #
    # 기본값 0은 자리 표시다 — 실측이 이 줄을 갱신한다. 근거(측정 장소·회차 수치·
    # P₂ 읽기 오차)는 services/README.md에 같이 남긴다. 0인 채로 두면 보정이 항등이라
    # 변환은 돌지만 위치가 사람 체감과 어긋난다.
    default-offset-ms: ${CHAT_SYNC_OFFSET_MS:0}
    # 채널별 덮어쓰기는 pokeclip.sync.channel-offset-ms.<채널ID>: <ms> 로 준다.
    # 환경변수가 아니라 yml이다 — 채널마다 다른 값이라 이름을 미리 못 정한다.
    #
    # 🔴 여기에 `channel-offset-ms: {}`(빈 맵)를 쓰지 마라. Spring의
    # YamlProcessor.buildFlattenedMap이 그것을 빈 문자열로 평탄화하고, Binder가
    # String → Map<String,Long> 변환기를 못 찾아 BindException이 난다.
    # SyncProperties는 @ConfigurationPropertiesScan이 모든 컨텍스트에 올리므로
    # 스프링 검사 전부와 운영 부팅이 통째로 죽는다(계획 검증이 재현). 줄을 아예 안 쓰면
    # compact 생성자가 null을 빈 맵으로 받는다 — 그래서 여기 주석만 있고 키가 없다.
