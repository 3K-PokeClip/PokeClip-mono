// 서버가 아니라 라이브러리다. bootJar를 만들지 않으므로 spring-boot 플러그인을 붙이지 않는다.
//
// common과 따로 두는 이유: services/CLAUDE.md가 common에 웹 계층을 금지한다.
// common은 계약(공유 엔티티·SQS DTO)만 두고, 여기는 두 서버 이상이 똑같이 쓰는
// 웹 인프라(CORS·상관 ID)만 둔다. 로직은 두지 않는다 — 경계가 흐려지면
// common과 같은 이유로 서버들이 한 덩어리가 된다.
plugins {
    id 'java-library'
    // LogCaptor를 서버 모듈에 넘겨주려고 켠다. 테스트 도우미를 main에 두면
    // 운영 jar에 딸려 가고, 서버마다 복사하면 사본이 갈린다.
    id 'java-test-fixtures'
}

dependencies {
    // api인 이유: 이 모듈을 쓰는 서버가 WebConfig·CorsConfig를 @Import 하려면
    // 그 타입들이 컴파일 클래스패스에 있어야 한다.
    api 'org.springframework.boot:spring-boot-starter-webmvc'
    api 'org.springframework.boot:spring-boot-starter-validation'

    testFixturesApi 'ch.qos.logback:logback-classic'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
