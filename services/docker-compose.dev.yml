# dev.pokeclip.com (EC2 i-07bcb578cb12f7ade) 에서 백엔드 4개 + 렌더 · 업로드 일꾼 + PostgreSQL 을 상시 띄운다.
#
# 저장소 루트의 docker-compose.yml 과 다른 파일이다 — 저쪽은 로컬 개발용이라
# media·세그먼트 인덱서·스텁까지 띄우고, 이쪽은 3번이 맡은 Spring 서버만 띄운다.
#
#   cd services && cp .env.dev.example .env && vi .env   # 값을 채운다
#   docker compose -f docker-compose.dev.yml up -d --build
#
# 빌드 컨텍스트가 services/ 여야 한다. Dockerfile 들이 settings.gradle 을 위로 찾아
# 올라가므로 저장소 루트에서 빌드하면 못 찾는다.

name: pokeclip-dev

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    # 컨테이너마다 메모리 상한을 둔다(POK-331). 없으면 하나가 넘칠 때 커널이 아무 컨테이너나 죽이고,
    # 있으면 넘친 그 컨테이너만 죽고 restart 가 다시 띄운다. 서버 넷은 힙(-Xmx) + JVM 바깥 몫(192~256MB)으로 잡았다.
    # postgres 는 공유 버퍼 128MB + 서버 넷의 커넥션(풀 기본 10씩, 최대 40)이라 넉넉히 둔다. 이것이 죽으면 넷이 다 멈춘다.
    # 합 2,496MB. 상한이지 예약이 아니라 합이 물리 메모리를 넘어도 뜨는 데는 지장이 없다.
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?cp .env.dev.example .env 먼저 실행하세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?cp .env.dev.example .env 먼저 실행하세요}
      POSTGRES_DB: ${POSTGRES_DB:?cp .env.dev.example .env 먼저 실행하세요}
    volumes:
      # 컨테이너를 지우고 다시 만들어도 데이터가 남는 자리다. 이 줄이 없으면
      # docker compose down 한 번에 계정·방송·채팅이 전부 사라진다.
      - pgdata:/var/lib/postgresql/data
    # ports 를 열지 않는다. 붙는 것은 같은 compose 네트워크의 서버 4개뿐이고,
    # 5432 를 EC2 밖으로 내면 퍼블릭 IP에 열린 DB가 된다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth:
    image: pokeclip-auth:dev
    build:
      context: .
      dockerfile: auth/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    # compose 기본은 10초인데 auth 종료 예산은 정리 풀 넷의 합 24초다(치지직 10 + 유튜브 4 + 탈퇴 6 + SOOP 4,
    # README 「종료 유예 24초 이상」). 잘리면 커밋 뒤 토큰 삭제가 중간에 끊겨 secrets에 원문이 남는다.
    # 예산 24 + 여유 1 = 25. 예산을 키우면 YoutubeShutdownBudgetTest가 이 값도 같이 본다.
    stop_grace_period: 25s
    depends_on:
      postgres:
        condition: service_healthy   # Flyway 가 뜨자마자 붙으므로 DB가 준비된 뒤여야 한다
    ports:
      # 넷 중 이것만 밖에 연다. 다만 "API가 auth 에만 있다"는 이제 틀렸다 —
      # 2026-08-24 실측 @RestController: auth 13 · clip 4 · chat-collector 2 · chat-detector 0.
      # clip 도 웹이 부르는 API를 갖게 됐지만 앞단 프록시가 생길 때 연다(아래 clip 절).
      # compose 는 모든 주소에 계속 열고, 바깥은 보안그룹이 막는다(POK-293 M12). 사람·배포 확인은 https 앞단(nginx → 웹)으로 오고,
      # 이 포트로 직접 오는 것은 영상 서버(media-dev)의 스트림키 확인 하나만 남긴다. 그 창구는
      # 소켓 주소로 출발지를 가리므로(SourceNetworkFilter) 프록시를 거치면 403 이다.
      # 127.0.0.1 로 좁히지 않는 이유도 그것이다(media-dev 는 다른 상자에서 사설 주소로 온다).
      - "8082:8082"
    environment:
      # compose 네트워크 안에서는 서비스 이름이 곧 호스트 이름이다.
      DB_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      # 아래 열셋을 compose가 전부 필수로 건다(:?). 그중 열둘은 값이 없으면 앱도 부팅에서 죽는다
      # (@NotBlank · CorsProperties · ChzzkProperties.App · YoutubeProperties.App 컴팩트 생성자).
      # 빈 문자열도 죽는다 — 값을 반드시 채운다. GOOGLE_REDIRECT_URI만 앱에 기본값이 있지만
      # 환경마다 달라 여기서는 명시를 강제한다.
      # 컨테이너는 호스트 셸의 변수를 자동으로 물려받지 않는다 — 여기 없는 값은 dev에서 그냥 빈다.
      JWT_SECRET: ${JWT_SECRET:?}
      SECRET_STORE_KEY: ${SECRET_STORE_KEY:?}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:?}
      CHZZK_CLIENT_ID: ${CHZZK_CLIENT_ID:?}
      CHZZK_CLIENT_SECRET: ${CHZZK_CLIENT_SECRET:?}
      CHZZK_REDIRECT_URI: ${CHZZK_REDIRECT_URI:?}
      # 유튜브 셋(POK-121). 로그인용 구글 앱과 다른 GCP 앱이다 — 업로드 권한은 프로젝트 단위 심사 대상이라
      # 폭발 반경을 나눴다. 셋 중 하나만 비어도 YoutubeProperties.App이 부팅을 세운다.
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:?}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:?}
      YOUTUBE_REDIRECT_URI: ${YOUTUBE_REDIRECT_URI:?}
      # SOOP 셋(POK-396). 셋 중 하나만 비어도 SoopProperties.App이 부팅을 세운다.
      # 🔴 :? 라 dev .env 에 셋이 없으면 compose 파일 전체가 멈춘다. 이 줄이 머지되기 전에 1번이 값을 넣는다.
      SOOP_CLIENT_ID: ${SOOP_CLIENT_ID:?}
      SOOP_CLIENT_SECRET: ${SOOP_CLIENT_SECRET:?}
      SOOP_REDIRECT_URI: ${SOOP_REDIRECT_URI:?}
      # 프로필 사진(POK-207). 창고 이름이 비면 사진 기능만 꺼진다 — 그래서 :? 가 아니라 :- 다.
      # 나머지 셋은 창고 이름이 차 있을 때만 필수이고, 그 판정은 PhotoProperties가 부팅에서 한다.
      # 🔴 FORCE_PATH_STYLE은 앱에 기본값(false)이 있어 DeploymentEnvVarsTest의 정규식(${VAR:})에
      # 안 걸린다 — 그 검사가 이 한 줄만 못 잡으니 손으로 챙긴다.
      PROFILE_PHOTO_S3_BUCKET: ${PROFILE_PHOTO_S3_BUCKET:-}
      PROFILE_PHOTO_S3_ENDPOINT: ${PROFILE_PHOTO_S3_ENDPOINT:-}
      PROFILE_PHOTO_S3_FORCE_PATH_STYLE: ${PROFILE_PHOTO_S3_FORCE_PATH_STYLE:-false}
      PROFILE_PHOTO_TOKEN_SECRET: ${PROFILE_PHOTO_TOKEN_SECRET:-}
      PROFILE_PHOTO_BASE_URL: ${PROFILE_PHOTO_BASE_URL:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      # 스트림키 암호 저장소(POK-272). 접두는 비면 기동을 거부한다: IAM 정책이 그 접두 안만 허용하고,
      # 로컬 기본값(pokeclip/local/stream-key/)으로 뜨면 재발급·탈퇴의 Secrets Manager 삭제가 권한 거부로 실패한다.
      # 🔴 이 줄이 :? 라서 dev .env 에 세 줄이 먼저 들어간 뒤에 코드를 머지한다. 빠지면 compose 가 파일 전체 보간에서
      # 멈춰 auth 만이 아니라 같은 배포 명령의 서버 넷이 다 안 올라간다.
      # 저장소 둘의 기본은 aws 다(병행 종료, POK-329). PG 에 스트림키 사본이 없어 .env 줄이 빠진 채 postgres 로 뜨면
      # 오류 없이 resolve 가 전부 valid:false 가 된다.
      STREAM_KEY_SECRET_STORE_TYPE: ${STREAM_KEY_SECRET_STORE_TYPE:-aws}
      STREAM_KEY_SECRET_RETIRE_FROM: ${STREAM_KEY_SECRET_RETIRE_FROM:-aws}
      STREAM_KEY_SECRET_REF_PREFIX: ${STREAM_KEY_SECRET_REF_PREFIX:?}
      # resolve 전용 출입증(계약4 4C — Media 가 X-Stream-Key-Resolve-Token 헤더로 부른다). :? 가 아니라 :- 다.
      # 토큰이 비면 그 창구만 닫히고(전용 헤더 요청은 늘 401) auth 는 뜬다 — 값을 넣기 전에 머지돼도 배포가 auth 를
      # 정상으로 다시 띄운다. 토큰을 넣으면 대역도 넣어야 하고, 아래 FORWARD_HEADERS_STRATEGY 가 none 이나 native 여야
      # 부팅한다.
      STREAM_KEY_RESOLVE_TOKEN: ${STREAM_KEY_RESOLVE_TOKEN:-}
      STREAM_KEY_RESOLVE_ALLOWED_CIDRS: ${STREAM_KEY_RESOLVE_ALLOWED_CIDRS:-}
      # 프록시 헤더 신뢰(POK-91). dev는 앞단이 없어 none. 로드밸런서를 붙이는 날 native 로 바꾼다.
      # 위 resolve 전용 창구는 native 위에서도 열린다(POK-316) — 전달 머리글(X-Forwarded-For 등)을 단 전용 헤더
      # 요청은 403 이다. Media 응답기는 auth 에 직접 붙어 그 머리글을 싣지 않는다.
      # 기본값이 있어 DeploymentEnvVarsTest의 정규식엔 안 걸리고 「기본값 있는 배포 변수」 명부가 잡는다.
      FORWARD_HEADERS_STRATEGY: ${FORWARD_HEADERS_STRATEGY:-none}
      # 탈퇴 정리 알림(POK-256)을 보낼 두 서버. 비면 auth 부팅이 거부된다. 기본값이 compose 안 주소라 .env는 비워 둔다.
      CLIP_BASE_URL: ${CLIP_BASE_URL:-http://clip:8081}
      COLLECTOR_BASE_URL: ${COLLECTOR_BASE_URL:-http://chat-collector:8083}
      # 힙을 안 묶으면 JVM 이 물리 메모리의 1/4씩 잡아 넷이 합쳐 한도를 넘고, 커널이 아무거나 하나를 죽인다.
      # 상자 크기 기록이 갈린다: 08-19 t3.small(2GB, 이 주석의 옛 판) · 09-15 t3.medium(4GB). 1번 확인 필요(POK-331).
      JAVA_TOOL_OPTIONS: -Xmx256m

  clip:
    image: pokeclip-clip:dev
    build:
      context: .
      dockerfile: clip/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # 루프백에 묶는다. 🔴 "부를 것이 없어서"가 아니라 "아직 앞단이 없어서"다 —
      # 그 차이가 다음 사람의 판단을 가른다. clip 은 이제 사람용 API 다섯
      # (/api/clip/** — 웹이 JWT 로 부른다)과 내부 API 하나(/internal/** — 판별기가
      # X-Internal-Token 으로 부른다)를 갖는다(POK-118).
      #   - /internal/** 은 같은 compose 네트워크의 chat-detector 가 부르므로
      #     서비스 이름(clip:8081)으로 닿는다. publish 가 필요 없다.
      #   - /api/clip/** 은 브라우저가 부르지만 이 파일에 리버스 프록시가 없다.
      #     지금 열어도 앞단이 없으므로 프록시를 넣는 카드에서 같이 연다.
      # 그때까지는 EC2 안에서 curl localhost:8081 로만 본다.
      - "127.0.0.1:8081:8081"
    environment:
      DB_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?}
      # 아래 둘은 auth 와 같은 값이어야 한다(같은 대칭키로 서명된 토큰을 검증하고,
      # 서버 간 토큰은 하나다). 없으면 부팅이 죽는다 — @NotBlank 이고 빈 문자열도 죽는다.
      # 🔴 둘 다 넣어야 한다. 로그는 한 번에 하나만 보여주므로 하나만 채우면 다음 것이
      # 또 막는다(2026-08-23 실측: internal-api.token 이 먼저 나오고, 채우면 jwt.secret).
      # 이 줄들이 없어서 clip 컨테이너가 재시작 루프에 빠져 있었다(PR #111 봇 지적 ③).
      JWT_SECRET: ${JWT_SECRET:?}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
      # 자격 판정을 물을 auth 주소. 없으면 clip 이 부팅을 거부한다(POK-117) —
      # 세그먼트 미리보기가 자격 판정 없이는 열리면 안 되기 때문이다.
      # compose 네트워크 안에서는 서비스 이름이 곧 호스트 이름이다(DB_HOST: postgres 와 같은 결).
      # 아래 chat-collector 절과 같은 형태다 — 같은 파일 안에서 두 서버가 다른 방식이면 안 된다.
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://auth:8082}
      # SQS 수신은 기본이 꺼짐이다. 켜려면 큐 URL 이 함께 필요하다(IntakeProperties).
      BROADCAST_INTAKE_ENABLED: ${BROADCAST_INTAKE_ENABLED:-false}
      BROADCAST_QUEUE_URL: ${BROADCAST_QUEUE_URL:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      # 영상 출입증(POK-122). 셋(키 번호·PKCS#8 비밀키·미디어 주소)이 다 비면 그 문만 503 이고
      # 나머지는 그대로 돈다(로컬엔 CloudFront 가 없다). 일부만 채우면 clip 이 부팅을 거부한다.
      # 🔴 여기 안 넘기면 호스트 .env 에 적어도 컨테이너 안에서는 늘 빈 값이다 — 표에만 적혀 있고
      # compose 가 안 넘겨 그 기능만 조용히 죽는 것이 이 파일이 이미 한 번 낸 사고다(PR #183 봇 지적).
      CLOUDFRONT_KEY_PAIR_ID: ${CLOUDFRONT_KEY_PAIR_ID:-}
      CLOUDFRONT_PRIVATE_KEY_PEM: ${CLOUDFRONT_PRIVATE_KEY_PEM:-}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-}
      PLAYBACK_COOKIE_DOMAIN: ${PLAYBACK_COOKIE_DOMAIN:-}
      PLAYBACK_ACCESS_TTL: ${PLAYBACK_ACCESS_TTL:-PT60M}
      PLAYBACK_REQUIRED: ${PLAYBACK_REQUIRED:-false}   # prod만 true(POK-321). 켜면 서명 설정 셋이 다 빈 「꺼짐」도, 쿠키 도메인 빈 값도 부팅 거부(POK-317)
      # 영상 만들기 주문(POK-125). 켜면 큐 둘·창고 둘이 필수다. 자격증명은 EC2 역할(인라인 정책 pokeclip-render-queue-and-clips).
      RENDER_ENABLED: ${RENDER_ENABLED:-false}
      RENDER_QUEUE_URL: ${RENDER_QUEUE_URL:-}
      RENDER_DLQ_URL: ${RENDER_DLQ_URL:-}
      CLIPS_BUCKET: ${CLIPS_BUCKET:-}
      SEGMENT_BUCKET: ${SEGMENT_BUCKET:-}
      # 유튜브 업로드 주문(POK-220). 켜면 줄 둘과 위 CLIPS_BUCKET 이 필수다(비면 부팅 거부). 자격증명은 같은 EC2 역할.
      UPLOAD_ENABLED: ${UPLOAD_ENABLED:-false}
      UPLOAD_QUEUE_URL: ${UPLOAD_QUEUE_URL:-}
      UPLOAD_DLQ_URL: ${UPLOAD_DLQ_URL:-}
      UPLOAD_RECONCILE_INTERVAL: ${UPLOAD_RECONCILE_INTERVAL:-PT1M}
      # 썸네일 주문(POK-277). 켜면 줄 주소가 필수다(비면 부팅 거부). 사진 창고는 위 CLIPS_BUCKET. 자격증명은 EC2 역할이고, 그 역할에 이 줄의 SQS 권한이 있어야 한다.
      # 이 줄들이 없을 때는 호스트 .env 에 값을 넣어도 컨테이너에 안 가서 dev 썸네일이 늘 꺼져 있었다(POK-331).
      THUMBNAIL_ENABLED: ${THUMBNAIL_ENABLED:-false}
      THUMBNAIL_QUEUE_URL: ${THUMBNAIL_QUEUE_URL:-}
      THUMBNAIL_INTERVAL: ${THUMBNAIL_INTERVAL:-PT1M}
      # 채팅 되감기 문 셋이 물어보는 수집기 주소(POK-234). 위 AUTH_BASE_URL 과 달리
      # 비어도 부팅은 산다 — 그 셋만 503 이고 카드 편집·목록·통로는 그대로 돈다.
      # 그래도 여기 넣는 이유는 「표에만 적혀 있고 compose 가 안 넘겨」 그 기능만 조용히
      # 죽는 것이 이 파일이 이미 한 번 낸 사고이기 때문이다(POK-128).
      COLLECTOR_BASE_URL: ${COLLECTOR_BASE_URL:-http://chat-collector:8083}
      # 놓친 방송 치우기(POK-244). 기본 꺼짐. 유예 20분 미만·장부 표(stream_segments) 없음은 부팅이 거부한다.
      # 이 compose 는 media 를 안 띄우지만 dev 공유 DB에는 1번이 장부 표를 만들어 두었다(2026-10-19, media-dev 가 쓴다).
      # 🔴 dev 에서는 켜지 않는다(1번 요청: 장부는 읽기만, 시험 조각은 백업 없는 유일본).
      BROADCAST_REAPER_ENABLED: ${BROADCAST_REAPER_ENABLED:-false}
      BROADCAST_REAPER_INTERVAL: ${BROADCAST_REAPER_INTERVAL:-PT1M}
      BROADCAST_REAPER_GRACE: ${BROADCAST_REAPER_GRACE:-PT30M}
      JAVA_TOOL_OPTIONS: -Xmx256m

  chat-collector:
    image: pokeclip-chat-collector:dev
    build:
      context: .
      dockerfile: chat-collector/Dockerfile
    restart: unless-stopped
    mem_limit: 576m
    # 🔴 compose 기본은 10초인데 이 서버의 종료 예산은 19초다(README 「종료 유예를 20초 준다」).
    # 잘리면 세션 닫기(구독 반납 REST 8초)가 중간에 끊겨 세션 키가 소모된 채 남고,
    # 스트리머당 3개뿐인 자리가 하나씩 마른다 — 유예를 15에서 20으로 올린 바로 그 이유다.
    # 예산 19 + 여유 1 = 20(POK-234 후원 flush 2초가 들어와 17→19). 예산을 키우면 ShutdownBudgetTest 가 깨지고
    # 이 값도 같이 본다. 채팅 중계(PR-B)는 새 항이 아니라 마지막 flush 대기 5초를 나눠 쓴다.
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # 루프백에 묶는다. @RestController 는 이제 0개가 아니다(POK-128 수집 상태 창구,
      # POK-92 영상 위치 창구) — 다만 둘 다 clip 이 compose 네트워크 안에서 부르는
      # 내부 창구라 밖에 열 이유가 없다. X-Internal-Token 하나로만 잠기므로 밖에 열면
      # 그 토큰이 유일한 방어선이 된다.
      - "127.0.0.1:8083:8083"
    environment:
      DB_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      # 수집은 기본이 꺼짐이다. 켜면 실제 치지직 세션을 잡아 연결 상한 3개를 먹는다.
      CHZZK_ENABLED: ${CHZZK_ENABLED:-false}
      CHZZK_ACCESS_TOKEN: ${CHZZK_ACCESS_TOKEN:-}
      # 비면 S3 아카이브가 통째로 꺼진다.
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      # auth 와 같은 값이어야 한다. 이쪽은 두 곳에 쓰인다 —
      # ① /internal/* 창구가 들어오는 요청을 검사할 때 ② 열쇠를 물으러 auth 를 부를 때.
      # 안 넘기면 창구가 스스로 잠기고(chat.internal_api.locked) 올바른 토큰으로도 401 이라,
      # clip 은 「수집 서버 장애」와 「모르는 방송」을 못 가른다. auth 가 이미 :? 로 요구하는
      # 값이라 이 compose 를 띄우려면 어차피 있어야 한다 — 그래서 여기도 필수다.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
      # compose 네트워크 안에서는 서비스 이름이 곧 호스트 이름이다(DB_HOST: postgres 와 같은 결).
      # 기본값 http://localhost:8082 를 그대로 두면 컨테이너 안에서 자기 자신을 가리킨다.
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://auth:8082}
      # 편지 경로는 기본이 꺼짐이다. 꺼져 있으면 방송 편지를 한 통도 안 먹으므로
      # 창구는 열려 있어도 모든 방송에 unknown 을 답한다(실측). 큐를 붙일 때 둘을 같이 켠다.
      #
      # 🔴 컨테이너 안 이름은 clip 과 같지만 호스트(.env) 이름은 갈라 받는다. 방송 편지는
      # 팬아웃이라 큐가 둘이어야 하는데(README 「나머지」), 한 변수로 묶으면 두 서버가 같은
      # 큐를 가리킨다. SQS 는 한 편지를 한 소비자에게만 주므로 그때 둘이 편지를 서로 뺏는다 —
      # clip 이 STARTED 를 먼저 집는 회차는 그 방송의 채팅이 안 걷히고, 반대 순서에서는
      # clip 이 방송 세션을 못 만든다. 둘 다 조용히 안 되는 모양이라 로그로도 안 드러난다.
      BROADCAST_INTAKE_ENABLED: ${CHAT_BROADCAST_INTAKE_ENABLED:-false}
      BROADCAST_QUEUE_URL: ${CHAT_BROADCAST_QUEUE_URL:-}
      # 재부착(POK-219). 켜면 clip 에 「지금 방송 중인 목록」을 주기적으로 물어, 붙어 있어야
      # 하는데 안 붙은 방송에 붙는다 — 재배포·재시작으로 잃은 방송을 줍는 복구 장치다.
      # 🔴 편지 경로가 꺼진 채 이것만 켜면 부팅이 거부된다(붙이는 문을 편지 경로가 만든다).
      CHAT_REATTACH_ENABLED: ${CHAT_REATTACH_ENABLED:-false}
      # 떼기(POK-244). clip 치우개(BROADCAST_REAPER_ENABLED)와 같이 켠다. 기본 꺼짐.
      CHAT_DETACH_ENABLED: ${CHAT_DETACH_ENABLED:-false}
      CHAT_DETACH_GRACE: ${CHAT_DETACH_GRACE:-PT10M}
      # compose 네트워크 안에서는 서비스 이름이 곧 호스트 이름이다(AUTH_BASE_URL 과 같은 결).
      # 기본값 http://localhost:8081 을 그대로 두면 컨테이너 안에서 자기 자신을 가리킨다.
      CLIP_BASE_URL: ${CLIP_BASE_URL:-http://clip:8081}
      # 채팅 중계(POK-234 PR-B). 켜면 받은 채팅·후원을 저장과 따로 clip 에 바로 민다(라이브 화면 SSE).
      # 위 CLIP_BASE_URL·INTERNAL_API_TOKEN 을 같이 쓴다. 기본 꺼짐 — 켜져 있으면 clip 이 없는 로컬에서
      # 묶음마다 실패 경고(10초 한 줄)가 난다. 표에는 영향이 없다.
      CHAT_RELAY_ENABLED: ${CHAT_RELAY_ENABLED:-false}
      CHAT_RELAY_BUFFER_MAX: ${CHAT_RELAY_BUFFER_MAX:-10000}
      BROADCAST_INFO_ENABLED: ${BROADCAST_INFO_ENABLED:-false}
      BROADCAST_INFO_INTERVAL: ${BROADCAST_INFO_INTERVAL:-PT1M}
      # 🔴 비밀. auth와 같은 치지직 앱 값. 방송 정보가 꺼져 있으면 비어도 된다.
      CHZZK_CLIENT_ID: ${CHZZK_CLIENT_ID:-}
      CHZZK_CLIENT_SECRET: ${CHZZK_CLIENT_SECRET:-}
      # SOOP 방송 지켜보기(POK-397). 기본 꺼짐. 켜면 INTERNAL_API_TOKEN · AUTH_BASE_URL · CLIP_BASE_URL 이 필요하다.
      SOOP_WATCH_ENABLED: ${SOOP_WATCH_ENABLED:-false}
      SOOP_DIAGNOSE_RESPONSE: ${SOOP_DIAGNOSE_RESPONSE:-false}
      SOOP_API_BASE_URI: ${SOOP_API_BASE_URI:-https://openapi.sooplive.com}
      # SOOP 채팅 받기(POK-397 PR4). 기본 꺼짐. 지켜보기가 꺼진 채 이것만 켜면 부팅이 거부된다.
      SOOP_CHAT_ENABLED: ${SOOP_CHAT_ENABLED:-false}
      # 🔴 비밀. auth 와 같은 SOOP 앱 값(같은 .env 이름). 채팅이 꺼져 있으면 비어도 된다 —
      # auth 블록은 :? 로 요구하지만 여기는 앱 기본값(빈 값)과 맞춰 :- 다.
      SOOP_CLIENT_ID: ${SOOP_CLIENT_ID:-}
      SOOP_CLIENT_SECRET: ${SOOP_CLIENT_SECRET:-}
      SOOP_CHAT_SDK_URL: ${SOOP_CHAT_SDK_URL:-https://static.sooplive.com/asset/app/chat-sdk/sooplive-chat-sdk.js}
      # 채팅 버퍼를 1만 건까지 들고 있어 넷 중 가장 많이 쓴다.
      JAVA_TOOL_OPTIONS: -Xmx320m

  chat-detector:
    image: pokeclip-chat-detector:dev
    build:
      context: .
      dockerfile: chat-detector/Dockerfile
    restart: unless-stopped
    mem_limit: 384m
    # DB 를 쓰게 됐다. postgres 가 뜬 뒤에 올라와야 한다.
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # 루프백에 묶는다(chat-collector 와 같은 이유 — 밖에 열 이유가 없다).
      # 이쪽은 아직 @RestController 가 실제로 0개이기도 하다.
      - "127.0.0.1:8084:8084"
    environment:
      DB_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      # clip·chat-collector 의 /internal/** 을 여는 열쇠. 셋이 같은 값이다.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
      # compose 네트워크 안에서는 서비스 이름이 곧 호스트 이름이다.
      CLIP_BASE_URL: http://clip:8081
      COLLECTOR_BASE_URL: http://chat-collector:8083
      JAVA_TOOL_OPTIONS: -Xmx192m

  # 렌더 · 업로드 일꾼(POK-332). 서버가 아니라 줄(SQS)에서 주문을 꺼내 일하고 clip에 보고만 한다. 웹 문도 health 주소도 없다.
  # 그래서 ports 가 없고, 배포 확인은 「떠 있나」와 「큐 주소가 비지 않았나」를 따로 본다(services-deploy.yml).
  # 🔴 큐 주소가 비면 일꾼은 그 줄을 아예 안 보고 그냥 떠 있다. 「떠 있다」만 보면 초록이다.
  # 빌드 컨텍스트가 각자의 폴더다(독립 Gradle 루트, services/ 의 settings.gradle 을 안 쓴다).
  # 🔴 AWS 키를 넣지 않는다. 자격 증명은 상자 역할(EC2 인스턴스 프로필)이 준다. 창고 이름은 env 가 아니라 주문서로 받는다.
  # 받는 쪽이라 clip 보다 먼저 올린다(옛 일꾼이 새 주문서 칸을 버리는 것을 막는다, workers/upload/README.md 「배포 순서」).
  # 메모리: ffmpeg 는 JVM 힙 밖에서 돈다. 힙은 작게, 상한은 인코딩 몫까지(1번 요청, 상자 t3.medium 4GiB). 서버 넷 · DB 와 합쳐
  # 상한 합 3,648MB 다(예약이 아니라 상한). 배포 끝 free -m 으로 보고, 모자라면 1번이 상자를 올린다.
  render-worker:
    image: pokeclip-render-worker:dev
    build:
      context: ../workers/render
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 768m
    environment:
      # 렌더 줄(계약1, 숨김 600초). 이 일꾼은 사진 주문줄(POK-277)도 같이 본다. 두 줄 다 clip 과 같은 값이다.
      RENDER_QUEUE_URL: ${RENDER_QUEUE_URL:-}
      THUMBNAIL_QUEUE_URL: ${THUMBNAIL_QUEUE_URL:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      # compose 네트워크 안에서는 서비스 이름이 곧 호스트 이름이다. 기본값 localhost 는 컨테이너 자기 자신이다.
      CLIP_BASE_URL: http://clip:8081
      # clip /internal/** 의 열쇠. 서버 넷과 같은 값이다. 줄을 보는데 비면 일꾼이 부팅을 거부한다.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
      JAVA_TOOL_OPTIONS: -Xmx192m

  upload-worker:
    image: pokeclip-upload-worker:dev
    build:
      context: ../workers/upload
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 384m
    environment:
      # 업로드 줄(숨김 900초). clip 과 같은 값이다. 유튜브 토큰은 주문서가 아니라 auth 내부 문에서 그때 받는다.
      UPLOAD_QUEUE_URL: ${UPLOAD_QUEUE_URL:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      CLIP_BASE_URL: http://clip:8081
      AUTH_BASE_URL: http://auth:8082
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
      JAVA_TOOL_OPTIONS: -Xmx160m

volumes:
  pgdata:
