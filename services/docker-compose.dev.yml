# dev.pokeclip.com (EC2 i-07bcb578cb12f7ade) 에서 백엔드 4개 + PostgreSQL 을 상시 띄운다.
#
# 저장소 루트의 docker-compose.yml 과 다른 파일이다 — 저쪽은 로컬 개발용이라
# media·세그먼트 인덱서·스텁까지 띄우고, 이쪽은 3번이 맡은 Spring 서버만 띄운다.
#
#   cd services && cp .env.dev.example .env && vi .env   # 값을 채운다
#   docker compose -f docker-compose.dev.yml up -d --build
#
# 빌드 컨텍스트가 services/ 여야 한다. Dockerfile 들이 settings.gradle 을 위로 찾아
# 올라가므로 저장소 루트에서 빌드하면 못 찾는다.

name: pokeclip-dev

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?cp .env.dev.example .env 먼저 실행하세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?cp .env.dev.example .env 먼저 실행하세요}
      POSTGRES_DB: ${POSTGRES_DB:?cp .env.dev.example .env 먼저 실행하세요}
    volumes:
      # 컨테이너를 지우고 다시 만들어도 데이터가 남는 자리다. 이 줄이 없으면
      # docker compose down 한 번에 계정·방송·채팅이 전부 사라진다.
      - pgdata:/var/lib/postgresql/data
    # ports 를 열지 않는다. 붙는 것은 같은 compose 네트워크의 서버 4개뿐이고,
    # 5432 를 EC2 밖으로 내면 퍼블릭 IP에 열린 DB가 된다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth:
    image: pokeclip-auth:dev
    build:
      context: .
      dockerfile: auth/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy   # Flyway 가 뜨자마자 붙으므로 DB가 준비된 뒤여야 한다
    ports:
      # 넷 중 이것만 밖에 연다. 다만 "API가 auth 에만 있다"는 이제 틀렸다 —
      # 2026-08-23 실측 @RestController: auth 12 · clip 4 · chat-collector 0 · chat-detector 0.
      # clip 도 웹이 부르는 API를 갖게 됐지만 앞단 프록시가 생길 때 연다(아래 clip 절).
      # 보안그룹도 8082 만 연다.
      - "8082:8082"
    environment:
      # compose 네트워크 안에서는 서비스 이름이 곧 호스트 이름이다.
      DB_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      # 아래 아홉은 전부 없으면 부팅이 죽는다(@NotBlank · CorsProperties ·
      # ChzzkProperties.App 컴팩트 생성자). 빈 문자열도 죽는다 — 값을 반드시 채운다.
      JWT_SECRET: ${JWT_SECRET:?}
      SECRET_STORE_KEY: ${SECRET_STORE_KEY:?}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:?}
      CHZZK_CLIENT_ID: ${CHZZK_CLIENT_ID:?}
      CHZZK_CLIENT_SECRET: ${CHZZK_CLIENT_SECRET:?}
      CHZZK_REDIRECT_URI: ${CHZZK_REDIRECT_URI:?}
      # t3.small 은 2GB다. 힙을 안 묶으면 JVM 이 물리 메모리의 1/4씩 잡아
      # 넷이 합쳐 한도를 넘고, 커널이 아무거나 하나를 죽인다.
      JAVA_TOOL_OPTIONS: -Xmx256m

  clip:
    image: pokeclip-clip:dev
    build:
      context: .
      dockerfile: clip/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # 루프백에 묶는다. 🔴 "부를 것이 없어서"가 아니라 "아직 앞단이 없어서"다 —
      # 그 차이가 다음 사람의 판단을 가른다. clip 은 이제 사람용 API 다섯
      # (/api/clip/** — 웹이 JWT 로 부른다)과 내부 API 하나(/internal/** — 판별기가
      # X-Internal-Token 으로 부른다)를 갖는다(POK-118).
      #   - /internal/** 은 같은 compose 네트워크의 chat-detector 가 부르므로
      #     서비스 이름(clip:8081)으로 닿는다. publish 가 필요 없다.
      #   - /api/clip/** 은 브라우저가 부르지만 이 파일에 리버스 프록시가 없다.
      #     지금 열어도 앞단이 없으므로 프록시를 넣는 카드에서 같이 연다.
      # 그때까지는 EC2 안에서 curl localhost:8081 로만 본다.
      - "127.0.0.1:8081:8081"
    environment:
      DB_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?}
      # 아래 둘은 auth 와 같은 값이어야 한다(같은 대칭키로 서명된 토큰을 검증하고,
      # 서버 간 토큰은 하나다). 없으면 부팅이 죽는다 — @NotBlank 이고 빈 문자열도 죽는다.
      # 🔴 둘 다 넣어야 한다. 로그는 한 번에 하나만 보여주므로 하나만 채우면 다음 것이
      # 또 막는다(2026-08-23 실측: internal-api.token 이 먼저 나오고, 채우면 jwt.secret).
      # 이 줄들이 없어서 clip 컨테이너가 재시작 루프에 빠져 있었다(PR #111 봇 지적 ③).
      JWT_SECRET: ${JWT_SECRET:?}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
      # 자격 판정을 물을 auth 주소. 없으면 clip 이 부팅을 거부한다(POK-117) —
      # 세그먼트 미리보기가 자격 판정 없이는 열리면 안 되기 때문이다.
      # compose 네트워크 안에서는 서비스 이름이 곧 호스트 이름이다(DB_HOST: postgres 와 같은 결).
      # 아래 chat-collector 절과 같은 형태다 — 같은 파일 안에서 두 서버가 다른 방식이면 안 된다.
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://auth:8082}
      # SQS 수신은 기본이 꺼짐이다. 켜려면 큐 URL 이 함께 필요하다(IntakeProperties).
      BROADCAST_INTAKE_ENABLED: ${BROADCAST_INTAKE_ENABLED:-false}
      BROADCAST_QUEUE_URL: ${BROADCAST_QUEUE_URL:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      JAVA_TOOL_OPTIONS: -Xmx256m

  chat-collector:
    image: pokeclip-chat-collector:dev
    build:
      context: .
      dockerfile: chat-collector/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # 루프백에 묶는다. clip 과 달리 이쪽은 진짜로 @RestController 가 0개라
      # 밖에서 부를 것이 아직 없다.
      - "127.0.0.1:8083:8083"
    environment:
      DB_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      # 수집은 기본이 꺼짐이다. 켜면 실제 치지직 세션을 잡아 연결 상한 3개를 먹는다.
      CHZZK_ENABLED: ${CHZZK_ENABLED:-false}
      CHZZK_ACCESS_TOKEN: ${CHZZK_ACCESS_TOKEN:-}
      # 비면 S3 아카이브가 통째로 꺼진다.
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      # auth 와 같은 값이어야 한다. 이쪽은 두 곳에 쓰인다 —
      # ① /internal/* 창구가 들어오는 요청을 검사할 때 ② 열쇠를 물으러 auth 를 부를 때.
      # 안 넘기면 창구가 스스로 잠기고(chat.internal_api.locked) 올바른 토큰으로도 401 이라,
      # clip 은 「수집 서버 장애」와 「모르는 방송」을 못 가른다. auth 가 이미 :? 로 요구하는
      # 값이라 이 compose 를 띄우려면 어차피 있어야 한다 — 그래서 여기도 필수다.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
      # compose 네트워크 안에서는 서비스 이름이 곧 호스트 이름이다(DB_HOST: postgres 와 같은 결).
      # 기본값 http://localhost:8082 를 그대로 두면 컨테이너 안에서 자기 자신을 가리킨다.
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://auth:8082}
      # 편지 경로는 기본이 꺼짐이다. 꺼져 있으면 방송 편지를 한 통도 안 먹으므로
      # 창구는 열려 있어도 모든 방송에 unknown 을 답한다(실측). 큐를 붙일 때 둘을 같이 켠다.
      #
      # 🔴 컨테이너 안 이름은 clip 과 같지만 호스트(.env) 이름은 갈라 받는다. 방송 편지는
      # 팬아웃이라 큐가 둘이어야 하는데(README 「나머지」), 한 변수로 묶으면 두 서버가 같은
      # 큐를 가리킨다. SQS 는 한 편지를 한 소비자에게만 주므로 그때 둘이 편지를 서로 뺏는다 —
      # clip 이 STARTED 를 먼저 집는 회차는 그 방송의 채팅이 안 걷히고, 반대 순서에서는
      # clip 이 방송 세션을 못 만든다. 둘 다 조용히 안 되는 모양이라 로그로도 안 드러난다.
      BROADCAST_INTAKE_ENABLED: ${CHAT_BROADCAST_INTAKE_ENABLED:-false}
      BROADCAST_QUEUE_URL: ${CHAT_BROADCAST_QUEUE_URL:-}
      # 채팅 버퍼를 1만 건까지 들고 있어 넷 중 가장 많이 쓴다.
      JAVA_TOOL_OPTIONS: -Xmx320m

  chat-detector:
    image: pokeclip-chat-detector:dev
    build:
      context: .
      dockerfile: chat-detector/Dockerfile
    restart: unless-stopped
    # DB·외부 연동이 아직 없다. postgres 를 기다릴 이유가 없다.
    ports:
      # 루프백에 묶는다(chat-collector 와 같은 이유 — @RestController 가 0개다).
      - "127.0.0.1:8084:8084"
    environment:
      JAVA_TOOL_OPTIONS: -Xmx192m

volumes:
  pgdata:
