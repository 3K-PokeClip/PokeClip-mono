spring:
  application:
    name: pokeclip-core

  datasource:
    # 변수 이름을 팀 docker-compose(.env.example)와 맞췄다. `.env`를 그대로 쓰면
    # 로컬에서든 compose 안에서든 추가 설정 없이 붙는다.
    # compose 네트워크 안에서 띄울 때만 DB_HOST=postgres 를 준다.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:pokeclip}
    username: ${POSTGRES_USER:pokeclip}
    password: ${POSTGRES_PASSWORD:change-me-local-only}

  jpa:
    hibernate:
      # Flyway가 스키마의 주인이다. Hibernate는 엔티티와 실제 스키마가
      # 어긋나지 않았는지만 검사한다.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    # 세 서버가 DB 하나를 공유한다. 마이그레이션은 core만 돌린다 —
    # 두 서버가 각자 기본 이름의 이력 테이블을 만들면 나중에 뜬 쪽이 부팅에 실패한다.
    table: flyway_schema_history_core

logging:
  pattern:
    # 기본 콘솔 형식의 레벨 자리에 상관 ID를 끼워 넣는다. 값이 없으면 빈칸이다.
    # logback-spring.xml을 만들지 않는 이유는 배포가 없어 환경별 형식이
    # 아직 필요 없어서다.
    level: "%5p [%X{requestId:-}]"

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health

pokeclip:
  jwt:
    # 기본값을 빈 문자열로 두고 @NotBlank로 잡는다. 기본값을 아예 안 주면
    # 환경변수가 없을 때 부팅이 죽는 게 아니라 리터럴 "${JWT_SECRET}"이 값으로
    # 바인딩돼 서버가 그냥 뜬다 — 로그인만 전부 401이 되고 신호가 안 남는다.
    secret: ${JWT_SECRET:}
    access-token-ttl: PT30M
    refresh-token-ttl: P14D
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:3000/auth/callback}
    token-uri: https://oauth2.googleapis.com/token
    jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
  cors:
    # 비면 부팅이 실패한다(CorsProperties). 기본값으로 localhost를 주지 않는 이유는
    # 그러면 운영 배포에 localhost가 딸려가고, 로컬에선 되고 운영에서만 막히는데
    # 로그는 조용하기 때문이다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
