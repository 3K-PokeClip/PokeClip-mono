spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    table: flyway_schema_history_clip

pokeclip:
  cors:
    allowed-origins: http://localhost:3000

  jwt:
    # TestTokens.SECRET과 같은 문자열이어야 한다. 갈리면 인증 시험이 통째로 401이 된다.
    secret: test-only-jwt-secret-at-least-32-bytes!!

  internal-api:
    token: test-only-internal-token-32bytes-long!!

  auth-client:
    # 🔴 이 줄이 없으면 clip의 모든 @SpringBootTest가 죽는다. base-url의 운영 기본값이
    # 비어 있고(부팅 게이트), @ConfigurationPropertiesScan이 이 프로퍼티를 모든 컨텍스트에
    # 올리며, DelegationResolveClient가 조건 없이 만들어져 validate()가 전 부팅을 막는다
    # (계획 검증 실측: HealthEndpointTest FAILED ← IllegalStateException).
    #
    # 🔴 스프링 시험에서는 이 값이 실제로 쓰이지 않는다 — IntegrationTestSupport가
    # @DynamicPropertySource로 가짜 auth의 주소를 덮는다(POK-174). 그래서 「덮어쓰기를
    # 빠뜨리면 연결 거부로 드러난다」는 옛 설명은 더 이상 맞지 않는다. 지금 그 자리를
    # 지키는 것은 가짜 auth의 초기 응답이 503이라는 것이다 — 답을 안 건 시험은 통과가
    # 아니라 거절을 받는다.
    #
    # 컨텍스트를 안 띄우는 시험(AccessibleClientTest·DelegationResolveClientTest)은
    # 각자 가짜 서버를 세워 생성자에 직접 넣으므로 이 값과 무관하다.
    base-url: http://127.0.0.1:1

  jump-card:
    stream:
      # 시험은 한 사용자로 연결을 여러 번 열고 닫는다. 끊긴 자리는 즉시 반납되지 않아서
      # (서버는 다음 쓰기가 실패해야 안다) 운영 기본값 4로는 뒤 시험이 503으로 오염된다.
      # 상한 자체를 재는 시험은 자기 @TestPropertySource로 4를 다시 건다.
      max-per-user: 50

  broadcast:
    intake:
      # 테스트는 큐에 안 붙는다. 진짜 왕복은 SqsIntakeEndToEndTest가 LocalStack으로 잰다.
      enabled: false
      region: ap-northeast-2
      wait-time: 20s
      max-messages: 10
