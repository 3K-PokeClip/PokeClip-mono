spring:
  application:
    name: pokeclip-clip

  datasource:
    # 변수 이름을 팀 docker-compose(.env.example)와 맞췄다. `.env`를 그대로 쓰면
    # 로컬에서든 compose 안에서든 추가 설정 없이 붙는다.
    # compose 네트워크 안에서 띄울 때만 DB_HOST=postgres 를 준다.
    #
    # 접속값 셋에는 기본값을 주지 않는다(POK-161). 기본값을 두면 공개 저장소의
    # .env.example에 적힌 값으로 실제 DB에 붙는 창이 열린다. DB_HOST·DB_PORT는
    # .env에 없는 값이라 지우면 로컬이 깨진다 — 일부러 남긴다.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      # Flyway가 스키마의 주인이다. Hibernate는 엔티티와 실제 스키마가
      # 어긋나지 않았는지만 검사한다.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    # 네 서버가 DB 하나를 공유한다(ADR-022 — 서비스만 나누고 DB는 공유).
    # 각 서버가 자기 이력 테이블을 갖는다. 기본 이름을 그대로 쓰면 나중에 뜬 쪽이
    # 남의 이력을 자기 것으로 읽고 부팅에 실패한다.
    # 마이그레이션 번호는 모듈별 대역을 쓴다 — V1xx auth · V2xx clip · V3xx chat.
    table: flyway_schema_history_clip
    # 공유 DB에서 어느 서버가 먼저 뜰지 정해져 있지 않다. 다른 서버가 이미 표를
    # 만든 DB에 자기 이력 테이블 없이 뜨면 "Found non-empty schema(s) but no
    # schema history table"로 죽는다. Testcontainers는 매번 빈 DB라 이걸로는
    # 안 잡혀서, IntegrationTestSupport가 더미 표를 먼저 심는다.
    baseline-on-migrate: true
    baseline-version: 0

  http:
    clients:
      # 복수형이다. 단수형 spring.http.client.*는 아무것도 바인딩하지 않고 오류도 없다
      # (auth·chat-collector에서 두 번 밟은 함정). auth가 연결만 받고 답을 안 하면
      # 이 시한이 유일한 탈출구다 — 없으면 미리보기 요청이 톰캣 스레드를 무기한 쥔다.
      # 실측: 응답 안 주는 서버에 5,031ms에 SocketTimeoutException(계획 검증 Q2).
      connect-timeout: 2s
      read-timeout: 5s

logging:
  pattern:
    # 기본 콘솔 형식의 레벨 자리에 상관 ID를 끼워 넣는다. 값이 없으면 빈칸이다.
    level: "%5p [%X{requestId:-}]"
  level:
    # 🔴 이 서버의 첫 발신 HTTP다. clip 클래스패스에 AWS SDK가 끌어온 httpclient5가 있어
    # 팩토리가 JDK가 아니라 Apache HC5로 뽑히고, 그 두 로거가 DEBUG에서 나가는 헤더를
    # 통째로 찍는다 — X-Internal-Token 평문 유출을 실측했다(계획 검증 F4, 2건).
    # 그 토큰은 auth·clip·chat-collector 셋의 /internal/**을 여는 열쇠다.
    # chat-collector가 같은 자리를 이미 막아 뒀다(POK-116).
    # AuthClientTokenLeakTest가 root를 TRACE로 올린 채 이 줄이 버티는지 잰다 — 지우면
    # 그 검사가 빨간불이다(구현 때 재현: 호출 2회에 headers·wire가 각각 찍어 유출 4건).
    org.apache.hc.client5.http: info
    # 🔴 이 줄도 위와 똑같이 「유일한 차단막」이다. 구현 중에 「지워도 전부 초록이니 방어
    # 깊이일 뿐」이라고 적어 뒀는데 거짓이었고, 감사 2회차가 반증했다 — 스위치가 둘이라
    # 기본 설정에서만 안 보였다. DispatcherServlet은 TRACE에서 요청 헤더를 찍는데, 평소에는
    # spring.mvc.log-request-details(Boot 기본 false)가 그것을 "N header(s)"로 접는다.
    # root=TRACE 고정으로 나머지 둘을 갈라 실측한 결과:
    #   log-request-details=false + 이 줄 제거 → 유출 0   (그래서 못 보고 넘어갔다)
    #   log-request-details=true  + 이 줄 제거 → 🔴 JWT 통째로 유출
    #   log-request-details=true  + 이 줄 유지 → 유출 0   (이 줄이 막는다)
    # 유출 주체는 org.springframework.web.servlet.DispatcherServlet이다.
    # 그 프로퍼티는 Boot 공식 값이고 자기 문서가 "민감 정보를 찍을 수 있다"고 경고한다 —
    # 사람이 그걸 켜는 순간은 정확히 이 문을 디버깅할 때이므로, 아래 coyote 줄을 정당화한
    # 논증(root=TRACE를 켜는 순간)과 글자 그대로 같다.
    # SegmentApiTokenLeakTest.요청_상세_로깅을_켜도_액세스_토큰이_로그에_안_남는다가
    # 그 값을 런타임에 켜고 진짜 요청을 태워 행동으로 잰다(양성 대조 포함).
    org.springframework.web: info
    # 🔴 hc5 줄은 「나가는」 HTTP만 막고, 이 줄은 「들어오는」 쪽이다(위 spring 줄은 로거
    # 트리가 넓어 양쪽에 걸친다). 같은 뿌리인데 한쪽만 막혀 있었다 — POK-118이 첫 컨트롤러를
    # 열어 이 면적이 생겼고, POK-117의 세그먼트 미리보기가 사람 문을 하나 더 열었다.
    # root를 TRACE로 내리면 톰캣 org.apache.coyote.http11.Http11InputBuffer가 받은 바이트를
    # "Received [GET /api/clip/... Authorization: Bearer <JWT> ...]"로 통째로 찍는다.
    # 2026-08-24 clip 실측: root INFO 0건 · DEBUG 0건 · TRACE 1건(chat-collector가 POK-128에서
    # 잰 값과 같다). 톰캣이 JUL FINER로 찍고 브릿지가 logback DEBUG로 번역하므로
    # root=DEBUG에서는 안 보인다 — 조건은 root=TRACE 하나다.
    # 새는 값이 사람의 액세스 토큰이라, 한 번 남으면 그 편집자가 되어 남의 방송을 열 수 있다.
    # 사람이 TRACE를 켜는 순간은 정확히 이 문을 디버깅할 때다.
    # SegmentApiTokenLeakTest.미리보기를_쳐도_…가 root를 TRACE로 내린 채 실제로 요청을 태워
    # 이 줄이 막는지 행동으로 잰다. 그 검사는 「톰캣이 지금도 그 헤더를 찍는가」까지 같이
    # 잰다 — JUL 핸들러를 잎(Http11InputBuffer)에 직접 걸어 기록을 받아 본다. 톰캣이
    # 조용해지는 날 "안 샜다"가 아무것도 안 본 채 초록이 되는 것을 그 단언이 막는다.
    org.apache.coyote: info

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # 이게 없으면 Boot 기본값 never가 걸려 detail이 HTTP 응답에서 잘린다.
      # IntakeHealth가 withDetail("status", …)·withDetail("lastPollSucceededAt", …)를
      # 아무리 잘 만들어도 밖에서는 {"status":"UP"}만 보이고, 그러면 "서버는 떴는데
      # 수신은 죽은" 상태를 구분할 수 없다 — 이 카드가 막으려는 실패 그 자체다.
      # PRD 성공 기준이 "상세에 꺼져 있음이 보인다"라 이 줄이 그 기준의 일부다.
      #
      # 지금 detail에 담기는 것은 상태 이름·마지막 성공 시각·실패 사유 클래스명뿐이라
      # 비밀이 없다. 큐 주소는 일부러 안 담는다(IntakeConfiguration 참고).
      # 비밀이 담기는 detail을 추가하는 날 이 줄을 다시 봐야 한다.
      show-details: always

pokeclip:
  jwt:
    # auth와 같은 값이어야 한다 — 같은 대칭키로 서명된 토큰을 검증한다(ADR-048).
    # 이 서버는 발급하지 않는다.
    # 기본값을 빈 문자열로 두는 이유는 auth와 같다 — 안 주면 리터럴 "${JWT_SECRET}"이
    # 값으로 바인딩돼 서버는 그냥 뜨고, 사람 API만 전부 401이 되고 신호가 안 남는다.
    secret: ${JWT_SECRET:}

  internal-api:
    # 판별기(chat-detector)가 X-Internal-Token 헤더로 보낸다. auth와 같은 값이다 —
    # 서버 간 토큰은 하나다. 빈 기본값을 두는 이유는 JWT_SECRET과 같다.
    #
    # POK-117부터 이 값이 나가는 방향으로도 쓰인다 — DelegationResolveClient가 auth의
    # /internal/**에 같은 헤더로 보낸다. 새 토큰 프로퍼티를 만들지 않는 이유가 그것이다.
    token: ${INTERNAL_API_TOKEN:}

  auth-client:
    # auth 내부 창구 주소(8082). 기본값이 없다 — 이 서버의 사람 문(세그먼트 미리보기)이
    # 자격 판정 없이는 안 열리므로, 주소가 비면 부팅을 거부하는 것이 맞다(PRD 결정).
    # chat-collector는 localhost 기본값을 주는데 그쪽은 조건부(편지 경로)라 처지가 다르다.
    base-url: ${AUTH_BASE_URL:}

  jump-card:
    # 집은 카드를 놓지 않아도 이 시간이 지나면 누구나 다시 집는다. 만료를 치우는 배경
    # 작업이 없고 집을 때 판정한다. 측정값이 아니라 추정이다 — 편집자가 한 카드를 붙들고
    # 있는 시간을 아직 안 재 봤다.
    claim-ttl: PT30M

    stream:
      # ⚠ 아래 숫자는 측정값이 아니라 추정이다. 동시 사용자 100명 전제에서 넉넉히 잡았고 실사용 후 조정한다.
      # 앞단 프록시가 조용한 연결을 끊지 않게 주기적으로 주석을 보낸다.
      # 로컬엔 프록시가 없어 이 값이 틀려도 배포 후에만 드러난다.
      heartbeat: PT20S
      # 연결 수명 상한. 실제 수명은 min(이 값, 토큰 exp까지 남은 시간)이다.
      timeout: PT4H
      # 전송 스레드 수. 연결은 스트라이프 하나에 고정돼 순서가 지켜진다.
      # 안 읽는 구독자는 자기 스트라이프만 막는다 — send 시한 장치는 두지 않는다(작동하지 않는다,
      # CardStreamExecutor 주석 참고). 막힌 연결은 서버의 write timeout이 IOException으로 푼다.
      stripes: 4
      # 스트라이프당 대기 상한. 넘치면 버리고 WARN.
      # ⚠ 「재연결이 전체 스냅샷으로 메운다」는 <b>실시간 발행(publish)에만</b> 참이다.
      #   초기 스냅샷에는 거짓이다 — 재연결해도 같은 스냅샷이라 같은 자리에서 또 잘린다
      #   (2026-08-23 실측: 1200장에서 201건 유실이 2회차에도 그대로). 그래서 초기 스냅샷은
      #   카드 수와 무관하게 <b>큐를 한 칸만</b> 쓰도록 태스크 하나로 묶었다.
      queue-capacity: 1000
      # 탭 몇 개 + 모바일. 한 사람이 연결을 다 먹지 못하게.
      max-per-user: 4
      # 한 방송을 여는 사람 = 스트리머 + 편집자(정원은 POK-207 미정).
      max-per-stream: 50
      # 서버 한 대 전체.
      max-total: 500

  broadcast:
    intake:
      # 기본이 꺼짐이다. 켜져 있으면 CI·남의 로컬이 뜰 때마다 없는 큐에 붙으려 한다.
      enabled: ${BROADCAST_INTAKE_ENABLED:false}
      # 켜져 있을 때만 필수다(IntakeProperties가 검사한다).
      queue-url: ${BROADCAST_QUEUE_URL:}
      region: ${AWS_REGION:ap-northeast-2}
      # 비면 진짜 AWS. 로컬 실측 때만 LocalStack 주소를 준다.
      endpoint: ${BROADCAST_QUEUE_ENDPOINT:}
      # SQS 롱폴링 최대값. 짧게 잡으면 빈 응답만 반복해 요청 수가 는다.
      wait-time: 20s
      max-messages: 10

  cors:
    # 비면 부팅이 실패한다(CorsProperties). 기본값으로 localhost를 주지 않는 이유는
    # 그러면 운영 배포에 localhost가 딸려가고, 로컬에선 되고 운영에서만 막히는데
    # 로그는 조용하기 때문이다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
