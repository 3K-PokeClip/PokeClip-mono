spring:
  datasource:
    hikari:
      # 기본값 10으로는 동시성 테스트의 신호가 불안정하다.
      #
      # 교환 경로는 요청 하나가 커넥션을 **둘** 쥔다 — exchange가 @Transactional로
      # 하나, 그 안의 recordAndCount가 REQUIRES_NEW로 또 하나(바깥 것은 반납되지
      # 않고 매달려 있다). 그래서 풀 10이면 동시 진입이 교환 rate limit의 한도 5
      # 언저리로 묶인다.
      #
      # 실측(락을 뺀 상태에서 10스레드가 한도를 통과한 건수):
      #   풀 10 → 6 · 7 · 6      (한도 5를 겨우 넘는다. 스케줄링 한 번에 초록이 될 폭이다)
      #   풀 30 → 9              (결정적으로 빨간불)
      # Hibernate가 커넥션을 지연 획득해 5보다 많이 들어가므로 "정확히 5로 막힌다"는
      # 아니다. 다만 신호가 한도에 붙어 있어 믿을 수 없다는 것이 요점이다.
      #
      # 발급·재발급의 8스레드 테스트도 같은 이유로 절반만 겹쳐 돌고 있었다.
      # 이 값을 되돌리면 그 테스트들의 "8스레드로 검증했다"가 다시 사실이 아니게 된다.
      # IntegrationTestSupport가 컨테이너 max_connections를 300으로 올려 받쳐 준다.
      maximum-pool-size: 30
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    table: flyway_schema_history_auth

pokeclip:
  jwt:
    secret: test-only-secret-key-at-least-32-bytes-long!!
    access-token-ttl: PT30M
    refresh-token-ttl: P14D
  google:
    client-id: test-client-id
    client-secret: test-client-secret
    redirect-uri: http://localhost:3000/auth/callback
    token-uri: http://localhost/unused
    jwk-set-uri: http://localhost/unused
  cors:
    allowed-origins: http://localhost:3000
  secret-store:
    # 테스트 전용 고정 키. 디코딩하면 "test-only-aes-256-key-32bytes!!!" = 정확히 32바이트다.
    # SecretStoreConfig가 32를 정확히 요구하므로 한 바이트만 어긋나도
    # IllegalStateException으로 컨텍스트가 죽고, IntegrationTestSupport를 상속한
    # 테스트가 전부 같이 죽는다. 값을 바꿀 일이 있으면 `base64 -d | wc -c`로 먼저 센다.
    key: dGVzdC1vbmx5LWFlcy0yNTYta2V5LTMyYnl0ZXMhISE=
  internal-api:
    token: test-only-internal-token-32bytes-long!!
  chzzk:
    app:
      client-id: test-chzzk-client-id
      client-secret: test-chzzk-client-secret
      redirect-uri: http://localhost:8081/oauth/chzzk/callback
    authorize-uri: https://chzzk.naver.com/account-interlock
    # 자리표시다. @NotBlank라 비울 수 없고, 실제 주소는 IntegrationTestSupport·RealServerTestSupport가
    # @DynamicPropertySource로 가짜 서버(FakeChzzkServer)로 덮어쓴다(DynamicPropertySource가 yml보다 우선).
    api-base-uri: http://127.0.0.1:1
    state-ttl: PT10M
    refresh-ahead: PT6H
    resolve-min-remaining: PT12H
    refresh:
      # 컨텍스트마다 틱이 돌면 DB를 뒤지고 HTTP를 시도한다. 배선은 ChzzkTokenRefreshSchedulerTest가 잰다.
      enabled: false
      interval: PT10M
  youtube:
    app:
      client-id: test-youtube-client-id
      client-secret: test-youtube-client-secret
      redirect-uri: http://localhost:8081/oauth/youtube/callback
    authorize-uri: https://accounts.google.com/o/oauth2/v2/auth
    # 자리표시다. @NotBlank라 비울 수 없고, 실제 주소는 IntegrationTestSupport·RealServerTestSupport가
    # @DynamicPropertySource로 가짜 서버(FakeYoutubeServer)로 덮어쓴다(DynamicPropertySource가 yml보다 우선).
    token-uri: http://127.0.0.1:1
    revoke-uri: http://127.0.0.1:1
    api-base-uri: http://127.0.0.1:1
    state-ttl: PT10M
    resolve-min-remaining: PT30M
    check:
      # 치지직 갱신 스케줄러와 같은 이유로 끈다. 배선은 전용 테스트가 잰다.
      enabled: false
      interval: PT1H
      staleness: PT24H

# 🔴 진짜 톰캣을 띄우는 검사(RANDOM_PORT)도 기본이 와일드카드다 — 주소를 안 정하면
#    남이 같은 번호의 127.0.0.1 을 잡아 요청을 가져간다(가짜 서버 셋과 같은 함정).
#    루프백에 못박으면 커널이 그 번호를 예약해 가로챌 창이 없어진다.
server:
  address: 127.0.0.1
