spring:
  application:
    name: pokeclip-auth

  datasource:
    # 변수 이름을 팀 docker-compose(.env.example)와 맞췄다. `.env`를 그대로 쓰면
    # 로컬에서든 compose 안에서든 추가 설정 없이 붙는다.
    # compose 네트워크 안에서 띄울 때만 DB_HOST=postgres 를 준다.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:pokeclip}
    username: ${POSTGRES_USER:pokeclip}
    password: ${POSTGRES_PASSWORD:change-me-local-only}

  jpa:
    hibernate:
      # Flyway가 스키마의 주인이다. Hibernate는 엔티티와 실제 스키마가
      # 어긋나지 않았는지만 검사한다.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    # 네 서버가 DB 하나를 공유한다(ADR-022 — 서비스만 나누고 DB는 공유).
    # 각 서버가 자기 이력 테이블을 갖는다. 기본 이름을 그대로 쓰면 나중에 뜬 쪽이
    # 남의 이력을 자기 것으로 읽고 부팅에 실패한다.
    # 마이그레이션 번호는 모듈별 대역을 쓴다 — V1xx auth · V2xx clip · V3xx chat.
    table: flyway_schema_history_auth
    # 공유 DB에서 뜨는 순서와 무관하게 부팅하려면 모든 Flyway 서버에 필요하다 —
    # auth가 "첫 서버"라는 보장이 없다. chat-collector가 먼저 마이그레이션한 빈 DB에
    # auth가 나중에 뜨면 public은 비어 있지 않은데 우리 이력 테이블은 없어서
    # "Found non-empty schema(s) ... but no schema history table"로 죽는다
    # (chat-collector 쪽 실측 2026-08-15, auth도 같은 메시지로 재현 — IntegrationTestSupport가
    # 그 상황을 심어 두어 이 두 줄을 지우면 auth 테스트 전체가 빨강이다).
    baseline-on-migrate: true
    # 기본 1이면 V1 이하가 스킵된다. 우리 대역은 V1xx라 실질 영향은 없지만,
    # "아무것도 스킵하지 않는다"를 정확히 말하려면 0이다.
    baseline-version: 0

  http:
    clients:
      # 단수형 spring.http.client.*는 4.0.0부터 deprecated고, 실제로 아무것도
      # 바인딩하지 않는다 — 오타를 내면 에러 없이 조용히 무시되고 타임아웃이
      # 사라진다. GoogleTimeoutTest가 바인딩 결과를 직접 확인하는 이유다.
      # 전역 설정이다 — auth의 모든 HTTP 클라이언트에 걸린다. 타임아웃은 인프라
      # 설정이지 구글 인증 설정이 아니므로 여기가 맞는 자리다.
      connect-timeout: 2s
      read-timeout: 5s

logging:
  level:
    # 이 로거를 DEBUG로 켜면 나가는 폼 본문이 통째로 찍힌다 —
    # DefaultRestClient.logBody가 "Writing [" 뒤에 본문을 그대로 붙이고,
    # LogFormatUtils를 안 거치므로 길이 상한이 없다. 구글 토큰 교환의
    # client_secret이 잘리지도 않고 남는다(들어오는 DTO 쪽은 100자에서 잘리지만
    # 43자 refresh 토큰은 그 안에 다 들어간다).
    # 구체 로거 레벨이 root보다 우선한다. 그래서 LOGGING_LEVEL_ROOT=debug로 내려도
    # 여기는 info다 — 방어를 "운영에서 DEBUG를 켜지 마라"는 사람의 규칙에 맡기지 않는다.
    org.springframework.web: info
  pattern:
    # 기본 콘솔 형식의 레벨 자리에 상관 ID를 끼워 넣는다. 값이 없으면 빈칸이다.
    # logback-spring.xml을 만들지 않는 이유는 배포가 없어 환경별 형식이
    # 아직 필요 없어서다.
    level: "%5p [%X{requestId:-}]"

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health

pokeclip:
  jwt:
    # 기본값을 빈 문자열로 두고 @NotBlank로 잡는다. 기본값을 아예 안 주면
    # 환경변수가 없을 때 부팅이 죽는 게 아니라 리터럴 "${JWT_SECRET}"이 값으로
    # 바인딩돼 서버가 그냥 뜬다 — 로그인만 전부 401이 되고 신호가 안 남는다.
    secret: ${JWT_SECRET:}
    access-token-ttl: PT30M
    refresh-token-ttl: P14D
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:3000/auth/callback}
    token-uri: https://oauth2.googleapis.com/token
    jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
  cors:
    # 비면 부팅이 실패한다(CorsProperties). 기본값으로 localhost를 주지 않는 이유는
    # 그러면 운영 배포에 localhost가 딸려가고, 로컬에선 되고 운영에서만 막히는데
    # 로그는 조용하기 때문이다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  secret-store:
    # base64로 인코딩한 32바이트(AES-256). 기본값을 빈 문자열로 두는 이유는
    # JWT_SECRET과 같다 — 안 주면 리터럴 "${SECRET_STORE_KEY}"가 바인딩돼
    # 서버는 뜨고 스트림키만 전부 실패한다.
    key: ${SECRET_STORE_KEY:}
  internal-api:
    # Media(1번)가 X-Internal-Token 헤더로 보낸다. 기본값을 빈 문자열로 두는
    # 이유는 JWT_SECRET과 같다 — 안 주면 리터럴이 바인딩돼 서버는 뜨고
    # 검증 API만 전부 401이 된다.
    token: ${INTERNAL_API_TOKEN:}
