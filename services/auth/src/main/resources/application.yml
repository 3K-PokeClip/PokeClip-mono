spring:
  application:
    name: pokeclip-auth

  datasource:
    # 변수 이름을 팀 docker-compose(.env.example)와 맞췄다.
    # compose 네트워크 안에서 띄울 때만 DB_HOST=postgres 를 준다.
    #
    # 셋(POSTGRES_DB·POSTGRES_USER·POSTGRES_PASSWORD)에 기본값을 주지 않는다.
    # 기본값을 두면 환경변수를 깜빡한 채로 굴러가는데, 그 값은 public 저장소의
    # .env.example에 적혀 있어 누구나 안다. compose는 같은 변수를 ${VAR:?}(누락 =
    # 부팅 거부)로 다루므로 정책도 이쪽이 맞다.
    #
    # DB_HOST·DB_PORT만 기본값을 남긴다 — .env에 없는 값이라 지우면 로컬이 깨진다.
    # RequiredPropertiesTest가 이 구분을 그대로 못박는다.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      # Hikari 기본값과 같은 10이다. 값을 바꾸는 게 아니라 "운영 풀은 10"을 글로 못박는다 —
      # 치지직 resolve는 커넥션을 쥔 채 외부 HTTP(read-timeout 5s)를 기다리므로 풀 크기가 곧
      # 동시 처리 상한이다. ChzzkResolvePoolExhaustionTest가 같은 10에서 동시 25로 잰다.
      maximum-pool-size: 10

  jpa:
    hibernate:
      # Flyway가 스키마의 주인이다. Hibernate는 엔티티와 실제 스키마가
      # 어긋나지 않았는지만 검사한다.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    # 네 서버가 DB 하나를 공유한다(ADR-022 — 서비스만 나누고 DB는 공유).
    # 각 서버가 자기 이력 테이블을 갖는다. 기본 이름을 그대로 쓰면 나중에 뜬 쪽이
    # 남의 이력을 자기 것으로 읽고 부팅에 실패한다.
    # 마이그레이션 번호는 모듈별 대역을 쓴다 — V1xx auth · V2xx clip · V3xx chat.
    table: flyway_schema_history_auth
    # 공유 DB에서 뜨는 순서와 무관하게 부팅하려면 모든 Flyway 서버에 필요하다 —
    # auth가 "첫 서버"라는 보장이 없다. chat-collector가 먼저 마이그레이션한 빈 DB에
    # auth가 나중에 뜨면 public은 비어 있지 않은데 우리 이력 테이블은 없어서
    # "Found non-empty schema(s) ... but no schema history table"로 죽는다
    # (chat-collector 쪽 실측 2026-08-15, auth도 같은 메시지로 재현 — IntegrationTestSupport가
    # 그 상황을 심어 두어 이 두 줄을 지우면 auth 테스트 전체가 빨강이다).
    baseline-on-migrate: true
    # 기본 1이면 V1 이하가 스킵된다. 우리 대역은 V1xx라 실질 영향은 없지만,
    # "아무것도 스킵하지 않는다"를 정확히 말하려면 0이다.
    baseline-version: 0

  servlet:
    multipart:
      # 잘라낸 512x512 PNG가 들어갈 크기. 크기 판정을 서블릿 층에서 하므로 앱이 바이트를
      # 다 받기 전에 끊는다 — 글자로 받았다면 재기 전에 이미 다 받아 놓게 된다.
      max-file-size: 2MB
      # 🔴 <b>요청 상한은 파일 상한보다 커야 한다.</b> 둘을 2MB로 같게 뒀더니 정확히 2MB인
      # 파일이 413이었다(실측) — max-file-size는 파일만 재는데 이쪽은 multipart 경계와
      # 파트 헤더까지 더해 재므로 <b>먼저 걸린다.</b> 그러면 실효 상한이 문서가 말하는 2MB보다
      # 작아지고, README의 「자르는 크기가 약 723px를 넘으면 거부된다」는 경계도 그만큼 낮아진다.
      # 3MB는 파일 상한 2MB + 오버헤드에 넉넉한 여유다. 파일 자체는 여전히 위 줄이 자른다.
      # ProfilePhotoSizeLimitTest.정확히_상한인_파일은_통과한다가 이 관계를 못박는다.
      max-request-size: 3MB

  http:
    clients:
      # 단수형 spring.http.client.*는 4.0.0부터 deprecated고, 실제로 아무것도
      # 바인딩하지 않는다 — 오타를 내면 에러 없이 조용히 무시되고 타임아웃이
      # 사라진다. GoogleTimeoutTest가 바인딩 결과를 직접 확인하는 이유다.
      # 전역 설정이다 — auth의 모든 HTTP 클라이언트에 걸린다. 타임아웃은 인프라
      # 설정이지 구글 인증 설정이 아니므로 여기가 맞는 자리다.
      connect-timeout: 2s
      read-timeout: 5s
      # s3가 Apache5를 딸려와 httpclient5가 클래스패스에 오르면 Boot가 RestClient 구현을
      # 오류 없이 바꾼다(이 카드에서 재현: JdkClientHttpRequestFactory →
      # HttpComponentsClientHttpRequestFactory). 위 connect 2s·read 5s는 구글·치지직·유튜브
      # 호출 전부에 걸린 실측값이라, 층이 바뀌면 어디서 끊는지를 다시 재야 하는 것이 된다.
      #
      # 이 핀을 잃으면 시한만 늘어나는 게 아니다 — httpclient5 5.6.1의 기본 재시도가 429·503에
      # 1회(간격 1초) 붙고, 상태코드 기반이라 POST도 탄다. 치지직 갱신은 users 행 락을 쥔 채
      # HTTP를 기다리므로(「알려진 구멍」 10번) 그 한 번이 그대로 잠금 시간이 된다.
      # AWS SDK 자기 경로는 무관하다 — apache5-client가 disableAutomaticRetries를 부른다.
      # 이 증폭은 스프링 쪽 핀을 잃었을 때만 생긴다.
      #
      # 단수형 spring.http.client.factory는 deprecated 별칭이고 spring.http.clients.factory는 없다.
      # RestClientFactoryTest가 RestClient·RestTemplate 양쪽 구현체를 직접 단언한다.
      imperative:
        factory: jdk

logging:
  level:
    # 이 로거를 DEBUG로 켜면 나가는 폼 본문이 통째로 찍힌다 —
    # DefaultRestClient.logBody가 "Writing [" 뒤에 본문을 그대로 붙이고,
    # LogFormatUtils를 안 거치므로 길이 상한이 없다. 구글 토큰 교환의
    # client_secret이 잘리지도 않고 남는다(들어오는 DTO 쪽은 100자에서 잘리지만
    # 43자 refresh 토큰은 그 안에 다 들어간다).
    # 구체 로거 레벨이 root보다 우선한다. 그래서 LOGGING_LEVEL_ROOT=debug로 내려도
    # 여기는 info다 — 방어를 "운영에서 DEBUG를 켜지 마라"는 사람의 규칙에 맡기지 않는다.
    org.springframework.web: info
    # SQL 오류를 WARN으로 찍으면서 <b>제약 위반 행의 값을 그대로 붙인다</b> —
    # uq_users_email에 걸리면 "Key (email)=(...) already exists"로 이메일이 평문으로 남는다
    # (authz-auditor 실측). 자바에서 예외를 잡아도 이 줄은 이미 찍힌 뒤라 안 사라진다.
    # 잃는 정보가 없다: 여기 실리는 내용은 예외에 그대로 들어 있고, 우리 핸들러가
    # 사유 코드로 로그에 남긴다. 이 프로젝트는 유니크 위반을 정상 제어 흐름으로 쓰기까지
    # 한다(초대·계정 생성 경합) — 그 WARN은 어차피 잡음이다.
    org.hibernate.orm.jdbc.error: error
    # 사진이 나가는 길 — S3 PUT 본문. AWS SDK 2.46.7의 HTTP 클라이언트는 Apache 5이고
    # org.apache.hc.client5.http.wire(본문 전체)·.headers(Authorization 값)가 DEBUG에 찍는다.
    # SDK 상위 계층 DEBUG는 서명 canonical request를 대량으로 남긴다. netty는 async
    # 클라이언트용이라 지금은 안 도는 길이지만 s3가 딸려오므로 같이 막는다.
    # 구체 로거가 root보다 우선하므로 root=TRACE로도 안 뚫린다 — SecretLeakTest가 그것까지 잰다.
    software.amazon.awssdk: info
    org.apache.hc.client5.http: info
    io.netty: info
  pattern:
    # 기본 콘솔 형식의 레벨 자리에 상관 ID를 끼워 넣는다. 값이 없으면 빈칸이다.
    # logback-spring.xml을 만들지 않는 이유는 배포가 없어 환경별 형식이
    # 아직 필요 없어서다.
    level: "%5p [%X{requestId:-}]"

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health

pokeclip:
  jwt:
    # 기본값을 빈 문자열로 두고 @NotBlank로 잡는다. 기본값을 아예 안 주면
    # 환경변수가 없을 때 부팅이 죽는 게 아니라 리터럴 "${JWT_SECRET}"이 값으로
    # 바인딩돼 서버가 그냥 뜬다 — 로그인만 전부 401이 되고 신호가 안 남는다.
    secret: ${JWT_SECRET:}
    access-token-ttl: PT30M
    refresh-token-ttl: P14D
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:3000/auth/callback}
    token-uri: https://oauth2.googleapis.com/token
    jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
  cors:
    # 비면 부팅이 실패한다(CorsProperties). 기본값으로 localhost를 주지 않는 이유는
    # 그러면 운영 배포에 localhost가 딸려가고, 로컬에선 되고 운영에서만 막히는데
    # 로그는 조용하기 때문이다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  secret-store:
    # base64로 인코딩한 32바이트(AES-256). 기본값을 빈 문자열로 두는 이유는
    # JWT_SECRET과 같다 — 안 주면 리터럴 "${SECRET_STORE_KEY}"가 바인딩돼
    # 서버는 뜨고 스트림키만 전부 실패한다.
    key: ${SECRET_STORE_KEY:}
  internal-api:
    # Media(1번)가 X-Internal-Token 헤더로 보낸다. 기본값을 빈 문자열로 두는
    # 이유는 JWT_SECRET과 같다 — 안 주면 리터럴이 바인딩돼 서버는 뜨고
    # 검증 API만 전부 401이 된다.
    token: ${INTERNAL_API_TOKEN:}
  chzzk:
    # 앱 셋은 한 덩어리다(ChzzkProperties.App). 하나만 빠져도 부팅에서 죽는다.
    # 기본값을 빈 문자열로 두는 이유는 JWT_SECRET과 같다.
    # redirect-uri는 개발자 센터에 앱당 하나만 등록된다(2026-08-17 확인) — 환경마다 앱이 다르다.
    app:
      client-id: ${CHZZK_CLIENT_ID:}
      client-secret: ${CHZZK_CLIENT_SECRET:}
      redirect-uri: ${CHZZK_REDIRECT_URI:}
    authorize-uri: https://chzzk.naver.com/account-interlock
    api-base-uri: https://openapi.chzzk.naver.com
    # state 수명. code(수 분)보다 길어 "동의 화면에서 지체 → INVALID_CODE"가 실제로 열린 창이다.
    state-ttl: PT10M
    # 스케줄러가 이만큼 남았을 때 미리 갱신한다. 방송 길이보다 길고 주기보다 충분히 크다.
    refresh-ahead: PT6H
    # 수집기에 넘기기 전 최소 남은 수명. 수집기는 한 번 받은 토큰으로 방송 끝까지 붙어 있는다.
    resolve-min-remaining: PT12H
    refresh:
      # 운영 기본 켜짐. 테스트 프로파일만 끈다 — 컨텍스트마다 틱이 돌아 DB를 뒤지고 HTTP를 시도하므로.
      # 꺼지면 갱신이 영영 안 돌고 증상은 24시간 뒤에 나온다. ChzzkTokenRefreshSchedulerTest가 배선을 잰다.
      enabled: true
      interval: PT10M
  youtube:
    # 앱 셋은 한 덩어리다(YoutubeProperties.App). 하나만 빠져도 부팅에서 죽는다.
    # 로그인용 구글 앱(pokeclip.google.*)과 다른 GCP 앱이다 — 업로드 권한은 프로젝트 단위
    # 심사 대상이라 폭발 반경을 나눴다.
    app:
      client-id: ${YOUTUBE_CLIENT_ID:}
      client-secret: ${YOUTUBE_CLIENT_SECRET:}
      redirect-uri: ${YOUTUBE_REDIRECT_URI:}
    authorize-uri: https://accounts.google.com/o/oauth2/v2/auth
    # 로그인(pokeclip.google.token-uri)과 주소가 같지만 별개 키로 둔다 — 앱이 다르다.
    token-uri: https://oauth2.googleapis.com/token
    revoke-uri: https://oauth2.googleapis.com/revoke
    # channels.list의 뿌리.
    api-base-uri: https://www.googleapis.com
    # state 수명. 치지직과 같은 이유로 10분이다.
    state-ttl: PT10M
    # 워커에 넘기기 전 최소 남은 수명. 구글 access가 1시간이라 치지직(12시간)과 자릿수가 다르다 —
    # 이보다 적게 남았으면 resolve가 즉석 갱신해서 준다.
    resolve-min-remaining: PT30M
    check:
      # 철회 점검. 운영 기본 켜짐, 테스트 프로파일만 끈다(치지직과 같은 이유).
      enabled: true
      # 틱 주기. 선별이 staleness로 거르므로 틱이 잦아도 회원당 구글 호출은 하루 1회다.
      interval: PT1H
      # 이보다 오래 확인 안 한 연동만 점검한다.
      staleness: PT24H
  profile-photo:
    # 창고 이름이 비면 사진 기능이 통째로 꺼진다(chat-collector의 S3_BUCKET 관례). CI·팀원 로컬 기본.
    # 이름을 PROFILE_PHOTO_ 접두어로 두는 이유: S3_BUCKET은 chat-collector가 이미 쓴다.
    # 같은 이름이면 .env.dev.example이 값을 하나만 가져 두 서버가 같은 창고를 가리킨다.
    bucket: ${PROFILE_PHOTO_S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
    # 비면 진짜 AWS. LocalStack·MinIO 등 호환 스토리지 주소(scheme+host+port).
    endpoint: ${PROFILE_PHOTO_S3_ENDPOINT:}
    force-path-style: ${PROFILE_PHOTO_S3_FORCE_PATH_STYLE:false}
    # 사진 표 서명키. 로그인 토큰(JWT_SECRET)과 다른 값이어야 한다 — 같으면 두 종류가 섞일 여지가 생긴다.
    # 창고 이름이 차 있는데 이것이 비면 PhotoProperties가 부팅을 세운다.
    token-secret: ${PROFILE_PHOTO_TOKEN_SECRET:}
    # 사진 주소의 앞부분(예 http://localhost:8082). 화면과 서버가 다른 주소에 있어 절대 주소가 필요하고,
    # 요청에서 유추하면 프록시 뒤에서 틀린다(X-Forwarded 미처리 — 「알려진 구멍」).
    base-url: ${PROFILE_PHOTO_BASE_URL:}
