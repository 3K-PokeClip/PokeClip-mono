# 스트림키 암호 이행 실행기 전용(POK-272, SecretStoreMigration). 웹·스케줄러 없이 떠서 한 번 돌고 끝난다.
# 실행: docker compose -f services/docker-compose.dev.yml run --rm \
#         -e SPRING_PROFILES_ACTIVE=<기존 프로필>,secret-migration auth [sync|verify]; echo "exit=$?"
spring:
  main:
    # 포트를 안 연다. 보안 설정 둘은 @ConditionalOnWebApplication이라 같이 빠진다(HttpSecurity 빈이 없어서다).
    web-application-type: none

pokeclip:
  # 스케줄러 셋을 끈다. 이행 중에 토큰 갱신·철회 점검·보관 기한 청소가 돌 이유가 없다.
  chzzk:
    refresh:
      enabled: false
  youtube:
    check:
      enabled: false
  retention:
    enabled: false
