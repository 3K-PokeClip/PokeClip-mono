import org.gradle.api.tasks.PathSensitivity

plugins {
    id 'java'
    id 'org.springframework.boot'
}

dependencyManagement {
    // Boot 4.1.0 BOM은 AWS SDK를 관리하지 않는다 — 여기서 한 번만 박는다(chat-collector와 같은 버전).
    imports { mavenBom 'software.amazon.awssdk:bom:2.46.7' }
}

dependencies {
    implementation project(':web-support')

    // 프로필 사진을 S3에 둔다(POK-207). s3가 runtime으로 끌어오는 HTTP 클라이언트는 Apache 5인데,
    // 그것이 클래스패스에 오르면 Boot가 RestClient 스택을 JDK에서 Apache5로 조용히 바꾼다 —
    // 구글·치지직·유튜브 호출의 실측 시한이 다른 층에서 끊게 된다. application.yml의
    // spring.http.clients.imperative.factory=jdk가 막고 RestClientFactoryTest가 지킨다.
    // 시한을 클라이언트에 박으려면 컴파일에서 보여야 해서 apache5-client를 명시한다.
    // url-connection-client는 넣지 않는다 — sync 구현이 둘이 되면 빌더가 SPI 순서에 갈린다.
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:apache5-client'

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // starter는 flyway-core만 가져온다. PostgreSQL 방언 모듈을 직접 넣지 않으면
    // 부팅 시 "Unsupported Database: PostgreSQL"로 죽는다.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'

    runtimeOnly 'org.postgresql:postgresql'

    // LogCaptor는 web-support의 테스트 픽스처에 하나만 둔다.
    testImplementation testFixtures(project(':web-support'))

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    // 가짜 S3. 2.x 좌표다 — 1.x의 org.testcontainers:localstack가 아니다.
    testImplementation 'org.testcontainers:testcontainers-localstack'
}

// DeploymentEnvVarsTest는 저장소의 배포 파일 둘을 읽는다. 입력으로 선언하지 않으면 그 파일만 바뀐 커밋에서
// Gradle이 테스트를 UP-TO-DATE로 건너뛰어 — 검사가 있는데도 안 도는 상태가 된다(실측: 변수를 지워도 초록,
// --rerun에서만 빨간불). 그 시험이 막으려는 사고가 정확히 「compose에만 빠뜨림」이라 치명적인 구멍이다.
tasks.named('test') {
    inputs.files(rootProject.file('docker-compose.dev.yml'), rootProject.file('.env.dev.example'),
            rootProject.file('README.md'))
            .withPropertyName('contractDocs')
            .withPathSensitivity(PathSensitivity.RELATIVE)
}
