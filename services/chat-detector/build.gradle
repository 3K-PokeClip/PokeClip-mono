plugins {
    id 'java'
    id 'org.springframework.boot'
}

dependencyManagement {
    // Boot 4.1.0 BOM은 AWS SDK를 관리하지 않는다. 다른 서버 셋과 같은 판으로 박는다.
    imports { mavenBom 'software.amazon.awssdk:bom:2.46.7' }
}

dependencies {

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // RestClient 클래스 자체는 webmvc가 끌어오는 spring-web에 있지만, RestClient.Builder
    // 자동설정과 spring.http.clients.* 시한 바인딩은 이 스타터에서 온다. 없으면 빈이 아예
    // 없어 주입이 죽고, 시한 설정은 오류 없이 통째로 무시된다(clip·auth·chat-collector 선례).
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 이 서버의 DB 접근은 JPA가 아니라 JdbcTemplate이다(chat-collector와 같은 모양).
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    // starter는 flyway-core만 가져온다. PostgreSQL 방언 모듈을 직접 넣지 않으면
    // 부팅 시 "Unsupported Database: PostgreSQL"로 죽는다.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'

    runtimeOnly 'org.postgresql:postgresql'

    // RDS IAM 토큰 서명(RdsUtilities)만 쓴다(POK-406). 서명은 로컬 계산이라 SDK HTTP 클라이언트가 필요 없다.
    // 🔴 HTTP 구현 둘을 뺀다. apache5-client가 httpclient5를 클래스패스에 올리면 Boot가 RestClient
    // 스택을 바꾼다(chat-collector build.gradle 주석). 자격 증명 조회(ECS 태스크 역할 · IMDS)는
    // SDK HTTP 클라이언트가 아니라 JDK 연결로 한다.
    implementation('software.amazon.awssdk:rds') {
        exclude group: 'software.amazon.awssdk', module: 'apache5-client'
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
    }

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    // 2.x 좌표다 — 1.x의 org.testcontainers:postgresql가 아니다.
    testImplementation 'org.testcontainers:testcontainers-postgresql'

    // LogCaptor. 지연 로그가 실제로 찍히는지 로그에서 직접 확인한다.
    // implementation(project(':web-support'))는 일부러 안 건다 — CorsProperties가 딸려 와
    // CORS_ALLOWED_ORIGINS 없이는 부팅이 실패한다. 이 서버는 브라우저 문이 없다.
    testImplementation testFixtures(project(':web-support'))
}

tasks.named('test') {
    // DocumentedEnvVarsTest가 이 파일을 읽는다. 선언하지 않으면 Gradle이 입력으로 안 세고,
    // README만 고친 실행에서 test 태스크가 UP-TO-DATE로 통째로 건너뛴다
    // (chat-collector가 결함 주입으로 실측한 자리다).
    inputs.file(rootProject.file('README.md'))
            .withPropertyName('servicesReadme')
            .withPathSensitivity(PathSensitivity.NONE)
}
