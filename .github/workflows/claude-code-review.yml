name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # 리뷰를 PR에 남기려면 write여야 한다. read면 잡은 성공으로 끝나는데
      # 코멘트가 하나도 안 올라온다 — 실패로 보이지 않아 원인 찾기가 어렵다.
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 리뷰는 base와 head를 비교해야 한다. depth 1이면 히스토리가 없어
          # 비교 대상을 못 만들고, 볼 게 없으니 몇 초 만에 조용히 끝난다.
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # --allowed-tools는 허용 목록이다. 여기 없는 도구는 전부 막힌다.
          #
          # Skill이 맨 앞인 이유: prompt의 /code-review:code-review가 Skill 호출이다.
          # 이걸 빠뜨리면 리뷰 스킬 자체가 차단되고, Claude가 Read·Grep으로 흉내만
          # 내다 끝난다 — 결과를 PR에 올리는 것도 스킬이 하는 일이라 코멘트가 0이 된다.
          # 잡은 성공으로 끝나서 실패로 보이지도 않는다.
          #
          # gh는 그 결과를 PR에 남기는 데 쓴다. 읽기 도구가 없으면 리뷰가 얕아진다.
          claude_args: '--allowed-tools "Skill,Read,Grep,Glob,Bash(git:*),Bash(gh:*)"'
          # ⚠️ 임시 진단용. 확인 끝나면 이 줄을 지운다.
          # 거부 1건이 남아 있는데 로그가 개수만 주고 도구 이름을 안 준다.
          # 세 번째 추측 대신 실물을 보려고 켠다. public 저장소라 리뷰 전문이
          # Actions 로그에 공개로 남는다 — 대상 코드가 이미 공개이고 시크릿은
          # Actions가 마스킹하지만, 오래 켜 둘 것은 아니다.
          show_full_output: true
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

