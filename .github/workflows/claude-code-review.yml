name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # 리뷰를 PR에 남기려면 write여야 한다. read면 잡은 성공으로 끝나는데
      # 코멘트가 하나도 안 올라온다 — 실패로 보이지 않아 원인 찾기가 어렵다.
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 리뷰는 base와 head를 비교해야 한다. depth 1이면 히스토리가 없어
          # 비교 대상을 못 만들고, 볼 게 없으니 몇 초 만에 조용히 끝난다.
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # claude_args를 주지 않는다. --allowed-tools는 허용 목록이라, 손으로 적는
          # 순간 안 적은 도구가 전부 막힌다. 실제로 그 목록에 Skill을 빠뜨려
          # 리뷰 스킬 자체가 차단됐고(거부 16→1, 그 1이 Skill이었다), Skill을
          # 넣어도 거부가 1로 남았다 — 스킬이 내부에서 쓰는 도구까지 다 적어야
          # 하는데 그게 무엇인지 우리가 알 수 없다. 액션 기본값에 맡긴다.

          # ⚠️ 임시 진단용. 리뷰가 PR에 실제로 붙는 것을 확인한 뒤 지운다.
          # 먼저 끄면 통했는지 볼 눈이 없어진다 — 지난번에 그렇게 한 번 헛돌았다.
          # public 저장소라 리뷰 전문이 Actions 로그에 공개로 남는다.
          show_full_output: true
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

