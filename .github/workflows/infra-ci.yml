# infra/terraform 전용 CI: Terraform 트리 · guard 정책 · 단계 직전 점검 스크립트를 고친 PR에서
# infra/terraform/README.md 「검증」 절의 명령을 모두 돌린다 (POK-312).
#
# 필수 체크가 아니다(ADR-0004). paths로 통째 스킵하는 구조라 필수로 걸면 infra를 안 건드린
# PR이 Pending으로 잠긴다(media-ci 머리 주석). 결과는 PR 화면의 체크 목록에서 머지 전에 본다.
#
# AWS에 닿지 않는다. secrets를 하나도 참조하지 않고 id-token 권한도 없어(OIDC로 역할을 받을 수
# 없다) 러너에 AWS 자격 증명이 생길 길이 없다. terraform은 -backend=false와 mock provider로만
# 돌고, 단계 직전 점검 시험이 부르는 aws는 가짜(precheck/tests/fakebin/aws)다.
#
# 도구 셋(terraform · conftest · shellcheck)은 제3자 액션 없이 배포처에서 직접 받아 아래에 적은
# sha256과 맞을 때만 쓴다. 판은 로컬에서 쓰는 판과 같다(2026-10-17 확인). 도구마다 RUNNER_TEMP
# 아래 제 디렉터리에 두고 GITHUB_PATH로 PATH 앞에 붙인다.
#
# 저장소가 공개라 이 로그도 공개다. 시험은 가짜 계정 ID · 가짜 이름만 쓴다.
#
# 한계:
#   - 러너의 bash는 5.2다. 스크립트가 지키는 macOS bash 3.2 제약은 여기서 검사되지 않는다(로컬 몫).
#   - guard_test의 config-first-folded 사례(ſ를 s로 접는 파일 시스템)는 ext4가 접지 않아 건너뛴다.
#     그 위협이 러너에는 없고, APFS에서의 그 사례는 로컬이 돌린다.
#   - modules/는 lock을 추적하지 않아 aws provider 최신판으로 돈다. 쓰인 판은 init 로그에 남는다.
name: infra-ci

on:
  pull_request:
    paths:
      - 'infra/terraform/**'
      # 계획상 미디어 상자 설정이 놓일 자리다. 그 시험은 디렉터리를 만드는 PR이 이 파일에 더한다.
      - 'infra/media-host/**'
      - '.github/workflows/infra-ci.yml' # 이 파일을 고치는 PR은 이 파일로 검증한다
      # paths는 PR의 변경 파일 3,000개까지만 본다. 그 뒤에 놓인 infra 파일은 감지되지 않아
      # 이 워크플로가 안 돌고, 필수 체크도 아니라 검사 없이 머지된다(fail-open). 그런 PR은 쪼갠다.

# GitHub API를 쓰지 않는다. checkout에 필요한 최소치로 못박는다.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# shell을 적어야 pipefail이 켜진다(적지 않으면 bash -e 뿐이다). guard_test 출력을 tee로 받는
# 단계가 이것에 기댄다 — 없으면 guard_test가 실패해도 tee의 종료 0으로 초록이 된다.
defaults:
  run:
    shell: bash

jobs:
  terraform:
    # 판을 고정한다. ubuntu-latest가 다음 판으로 넘어가도 도구 · 셸 판이 조용히 바뀌지 않게.
    runs-on: ubuntu-24.04
    # 임시 상한이다. 첫 실행 로그로 잰 뒤 고친다.
    timeout-minutes: 15
    env:
      CHECKPOINT_DISABLE: '1'
      TF_IN_AUTOMATION: '1'
      TF_INPUT: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # sha256 출처: releases.hashicorp.com의 terraform_1.16.4_SHA256SUMS 중 linux_amd64 줄
      # (2026-10-17 — 그 파일의 HashiCorp 서명도 확인). 판을 올릴 때는 두 값을 함께 바꾼다.
      - name: terraform 1.16.4 설치(sha256 고정)
        run: |
          version=1.16.4
          sha256=dc94af0eef1147718ad7c8daea792ed199e3e0492eec180d0adafa2a65a879df
          archive="${RUNNER_TEMP}/terraform.zip"
          bin="${RUNNER_TEMP}/terraform-bin"
          curl -fsSL --retry 3 -o "${archive}" \
            "https://releases.hashicorp.com/terraform/${version}/terraform_${version}_linux_amd64.zip"
          echo "${sha256}  ${archive}" | sha256sum --check --strict
          mkdir -p -- "${bin}"
          unzip -q "${archive}" terraform -d "${bin}"
          "${bin}/terraform" version
          echo "${bin}" >>"${GITHUB_PATH}"
          # provider는 이 잡 안에서만 함께 쓴다(루트마다 같은 aws provider를 다시 받지 않게).
          # 실행 사이의 캐시는 두지 않는다.
          mkdir -p -- "${RUNNER_TEMP}/terraform-plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=${RUNNER_TEMP}/terraform-plugin-cache" >>"${GITHUB_ENV}"

      - name: fmt
        run: terraform fmt -check -recursive infra/terraform

      # 루트 · 모듈은 목록으로 적지 않고 찾는다(.tf가 든 디렉터리). 새 루트가 생기면 저절로 들어온다.
      # scripts/ 아래는 guard fixture라 뺀다. 하나도 못 찾으면 찾는 식이 깨진 것이라 실패로 본다.
      # lock을 추적하는 루트는 -lockfile=readonly로 init한다 — lock과 다른 provider가 필요하면
      # lock을 고쳐 쓰지 않고 실패한다(PR에 실린 lock이 기준이다).
      - name: init · validate
        run: |
          dirs="$(find infra/terraform -path infra/terraform/scripts -prune \
            -o -name .terraform -prune -o -type f -name '*.tf' -printf '%h\n' | sort -u)"
          if [[ -z "${dirs}" ]]; then
            echo "init · validate 할 디렉터리가 0개다 — 찾는 식이나 경로가 깨졌다" >&2
            exit 1
          fi
          while IFS= read -r dir; do
            echo "::group::${dir}"
            lockfile=()
            if [[ -f "${dir}/.terraform.lock.hcl" ]]; then
              lockfile=(-lockfile=readonly)
            fi
            terraform -chdir="${dir}" init -backend=false -input=false "${lockfile[@]}"
            terraform -chdir="${dir}" validate
            echo "::endgroup::"
          done <<<"${dirs}"

      # mock provider로 plan만 만들어 assert를 본다. mock이어도 provider 스키마가 필요해 위 init이
      # 먼저다. 시험 파일(*.tftest.hcl)이 든 루트 · 모듈을 찾고, 0개면 실패로 본다.
      - name: terraform test
        run: |
          dirs="$(find infra/terraform -path infra/terraform/scripts -prune \
            -o -name .terraform -prune -o -type f -name '*.tftest.hcl' -printf '%h\n' |
            sed 's#/tests$##' | sort -u)"
          if [[ -z "${dirs}" ]]; then
            echo "terraform test 할 디렉터리가 0개다 — 찾는 식이나 경로가 깨졌다" >&2
            exit 1
          fi
          while IFS= read -r dir; do
            echo "::group::${dir}"
            terraform -chdir="${dir}" test
            echo "::endgroup::"
          done <<<"${dirs}"

  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # sha256 출처: conftest v0.71.1 릴리스의 checksums.txt 중 Linux_x86_64.tar.gz 줄(2026-10-17).
      # guard.sh는 conftest 출력 형식에 기대므로 판을 올릴 때는 guard_test를 함께 본다(README 한계).
      - name: conftest 0.71.1 설치(sha256 고정)
        run: |
          version=0.71.1
          sha256=c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985
          archive="${RUNNER_TEMP}/conftest.tar.gz"
          # 이 디렉터리에는 conftest 하나만 둔다. guard_test의 no-conftest 사례는 PATH에서
          # conftest가 든 디렉터리를 통째로 빼고 돌기 때문이다(다른 도구가 섞여 있으면 함께 빠진다).
          bin="${RUNNER_TEMP}/conftest-bin"
          curl -fsSL --retry 3 -o "${archive}" \
            "https://github.com/open-policy-agent/conftest/releases/download/v${version}/conftest_${version}_Linux_x86_64.tar.gz"
          echo "${sha256}  ${archive}" | sha256sum --check --strict
          mkdir -p -- "${bin}"
          tar -xzf "${archive}" -C "${bin}" conftest
          "${bin}/conftest" --version
          echo "${bin}" >>"${GITHUB_PATH}"

      - name: conftest verify(정책 단위 시험)
        run: |
          conftest verify -c infra/terraform/scripts/guard-data/empty-config.toml \
            --policy infra/terraform/policy/guard --namespace main

      # 건너뛴 사례도 판정한다. 이 러너(ext4 · 비root · conftest는 제 디렉터리에만)에서 건너뛰는
      # 사례는 config-first-folded 하나뿐이어야 한다. 다른 사례가 건너뛰면(예: 러너 이미지에
      # conftest가 따로 깔려 no-conftest가 빠짐) 초록이어도 덜 잰 것이라 실패로 본다.
      - name: guard_test(fixture 끝에서 끝까지)
        run: |
          log="${RUNNER_TEMP}/guard_test.log"
          bash infra/terraform/scripts/guard_test.sh 2>&1 | tee "${log}"
          skipped="$(sed -n 's/^skip: \([^(]*\)(.*/\1/p' "${log}")"
          if [[ "${skipped}" != 'config-first-folded' ]]; then
            echo "건너뛴 사례가 config-first-folded 하나가 아니다: ${skipped:-(없음)}" >&2
            exit 1
          fi

      - name: guard(실제 트리)
        run: bash infra/terraform/scripts/guard.sh

  shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 공식 체크섬 파일이 없다. sha256은 GitHub이 v0.11.0 릴리스 자산에 붙인 digest이고
      # (API · 2026-10-17), 받은 파일을 두 번(shasum · openssl) 재어 같은 값임을 확인했다.
      # 러너에 깔린 apt 판(0.9.0)은 경고 집합이 달라 쓰지 않는다 — 이 판이 PATH 앞에 선다.
      - name: shellcheck 0.11.0 설치(sha256 고정)
        run: |
          version=v0.11.0
          sha256=b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
          archive="${RUNNER_TEMP}/shellcheck.tar.gz"
          bin="${RUNNER_TEMP}/shellcheck-bin"
          curl -fsSL --retry 3 -o "${archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/${version}/shellcheck-${version}.linux.x86_64.tar.gz"
          echo "${sha256}  ${archive}" | sha256sum --check --strict
          mkdir -p -- "${bin}"
          tar -xzf "${archive}" -C "${bin}" --strip-components=1 "shellcheck-${version}/shellcheck"
          "${bin}/shellcheck" --version
          echo "${bin}" >>"${GITHUB_PATH}"

      # README 「검증」 절의 두 명령 그대로다(저장소 루트에서 — source 경로가 루트 기준이다).
      - name: shellcheck
        run: |
          shellcheck infra/terraform/scripts/*.sh
          shellcheck -x infra/terraform/scripts/precheck/*.sh \
            infra/terraform/scripts/precheck/lib/*.sh \
            infra/terraform/scripts/precheck/tests/*.sh \
            infra/terraform/scripts/precheck/tests/fakebin/aws

      # README의 루프는 실패를 적기만 하고 종료 0이라 그대로 쓰지 않는다. 하나가 실패해도 끝까지
      # 돌린 뒤 단계를 실패시키고, 시험이 0개여도 실패로 본다(글롭이 깨져 아무것도 안 돈 것을
      # 초록으로 내지 않게). 시험은 사례마다 임시 HOME을 쓴다(testlib::run). TMPDIR를 체크아웃
      # 안으로 바꾸지 않는다 — 증거 경로 검사가 조상의 .git을 거부해 시험이 깨진다.
      # testlib_test의 실행 비트 사례는 PATH에 실행 가능한 aws가 따로 있어야 통과한다(bash의
      # command -v는 실행 가능한 것이 없으면 실행 비트 없는 파일을 내준다). 러너 이미지의 AWS CLI가
      # 그 자리다 — 이미지에서 빠지면 이 단계가 빨개진다.
      - name: 단계 직전 점검 시험
        run: |
          if [[ -e "${HOME}/.pokeclip-precheck" ]]; then
            echo "시험 전부터 러너 HOME에 .pokeclip-precheck가 있다 — 무접촉을 판정할 수 없다" >&2
            exit 1
          fi
          count=0
          failed=0
          for test_file in infra/terraform/scripts/precheck/tests/*_test.sh; do
            [[ -f "${test_file}" ]] || continue
            count=$((count + 1))
            if ! bash "${test_file}"; then
              echo "FAIL ${test_file}" >&2
              failed=$((failed + 1))
            fi
          done
          echo "시험 ${count}개 · 실패 ${failed}개"
          if [[ "${count}" -eq 0 ]]; then
            echo "시험이 하나도 없다 — 글롭이나 경로가 깨졌다" >&2
            exit 1
          fi
          if [[ "${failed}" -ne 0 ]]; then
            exit 1
          fi

      # 시험은 러너의 실제 HOME을 건드리지 않아야 한다. 증거 루트($HOME/.pokeclip-precheck)가
      # 여기 생겼으면 testlib::run의 HOME 격리가 깨진 것이다.
      - name: 러너 HOME 무접촉 확인
        run: |
          if [[ -e "${HOME}/.pokeclip-precheck" ]]; then
            echo "시험이 러너 HOME에 .pokeclip-precheck를 만들었다 — HOME 격리가 깨졌다" >&2
            exit 1
          fi
          echo "러너 HOME에 .pokeclip-precheck 없음"
