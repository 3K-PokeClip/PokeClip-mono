# workers/ 전용 CI: 렌더·업로드 일꾼을 고친 PR에서 시험을 돌린다 (POK-330).
#
# 일꾼 시험은 ffmpeg가 없으면 조용히 건너뛰고, 건너뛴 시험은 성공으로 집계된다. 그래서 이
# 워크플로는 초록불이 「시험이 다 돌았다」를 뜻하도록 두 가지를 더 잰다.
#   1. 시험 결과(JUnit XML)의 건너뛴 수 합계가 0이 아니면 실패. 시험 코드를 고치지 않아도 되고
#      앞으로 생길 건너뛰기도 같이 잡는다(media-ci의 REQUIRE_PG와 같은 목적).
#   2. 렌더는 시험 전에 ffmpeg에 자막 태우기(subtitles, libass)가 있는지 본다. 없으면 렌더 시험이
#      건너뛰지 않고 「자막을 안 태우는 갈래」로 바꿔 초록이 되므로(ClipRendererTest의 burn) 1번으로는
#      못 잡는다. 판정 글자는 시험의 Ffmpeg.canBurnSubtitles()와 같게 둔다.
#
# 필수 체크가 아니다(저장소 설정은 1번 몫). 이유는 services-ci 머리 주석과 같다.
name: workers-ci

on:
  pull_request:
    paths:
      - 'workers/**'
      - '.github/workflows/workers-ci.yml' # 이 파일을 고치는 PR은 이 파일로 검증한다

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.worker }})
    runs-on: ubuntu-latest
    # 실측(2026-10-16, 두 번): render 2분~2분 30초 · upload 1분~1분 45초(꾸러미 설치 포함). 네 배쯤으로 둔다.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # 패키지는 각 일꾼 Dockerfile과 같게 둔다. 렌더는 자막의 한글 글꼴(fonts-noto-cjk)이
          # 있어야 libass가 네모 대신 글자를 찍는다. 업로드는 자막을 태우지 않는다.
          - worker: render
            packages: ffmpeg fonts-noto-cjk
            burns-subtitles: true
          - worker: upload
            packages: ffmpeg
            burns-subtitles: false
    defaults:
      run:
        # 일꾼은 services/와 따로 선 Gradle 빌드다. 각자 gradlew가 있다.
        working-directory: workers/${{ matrix.worker }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            workers/${{ matrix.worker }}/*.gradle
            workers/${{ matrix.worker }}/gradle/wrapper/gradle-wrapper.properties

      - name: ffmpeg 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}
          # head 대신 sed로 첫 줄만 찍는다. 기본 셸이 pipefail이라 head가 먼저 끝나면 ffmpeg가 SIGPIPE로
          # 죽어 단계가 실패할 수 있다(sed는 끝까지 읽는다).
          ffmpeg -hide_banner -version | sed -n 1p

      - name: 자막 태우기(libass) 확인
        if: matrix.burns-subtitles
        run: |
          # 목록을 먼저 다 받고 나서 찾는다. 파이프로 grep -q에 바로 넘기면 grep이 먼저 끝날 때 ffmpeg가
          # SIGPIPE로 죽고, pipefail 때문에 필터가 있는데도 「없다」로 갈린다.
          filters=$(ffmpeg -hide_banner -filters)
          if ! grep -q ' subtitles ' <<<"$filters"; then
            echo "이 ffmpeg에는 subtitles 필터(libass)가 없다. 렌더 시험이 자막을 안 태우는 갈래로 초록이 된다." >&2
            exit 1
          fi
          echo "subtitles 필터 있음"

      - name: 시험
        run: ./gradlew test

      # 시험과 다른 스텝이다. 시험이 실패하면 이 스텝은 돌지 않고 잡은 이미 빨갛다.
      # 시험이 0개여도 실패로 본다(결과 파일이 안 생겼으면 아무것도 안 잰 것이다).
      - name: 건너뛴 시험 0 확인
        run: |
          python3 - <<'EOF'
          import glob, sys, xml.etree.ElementTree as ET

          files = glob.glob('build/test-results/test/*.xml')
          tests = skipped = 0
          names = []
          for f in files:
              root = ET.parse(f).getroot()
              tests += int(root.get('tests', 0))
              skipped += int(root.get('skipped', 0))
              for case in root.iter('testcase'):
                  if case.find('skipped') is not None:
                      names.append(f"{case.get('classname')}.{case.get('name')}")
          print(f"결과 파일 {len(files)}개, 시험 {tests}개, 건너뜀 {skipped}개")
          for n in names:
              print(f"  건너뜀: {n}")
          if tests == 0:
              sys.exit("시험이 하나도 집계되지 않았다")
          if skipped:
              sys.exit("건너뛴 시험이 있다. ffmpeg나 도커가 없는지 위 이름으로 확인한다")
          EOF

      - name: 실패한 시험 리포트 올리기
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: workers-test-reports-${{ matrix.worker }}
          path: |
            workers/${{ matrix.worker }}/build/reports/tests/
            workers/${{ matrix.worker }}/build/test-results/
          retention-days: 7
