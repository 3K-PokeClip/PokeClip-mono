openapi: 3.1.0

info:
  title: PokeClip 내부 API (초안)
  version: 0.1.0
  description: |
    서비스끼리만 부르는 API. 브라우저에서 부르지 않는다.

    **경계를 넘는 호출은 전부 여기 적는다.** 워커가 DB에 직접 붙지 않게 하는 것이
    이 문서의 목적이다 — 붙게 두면 스키마를 고칠 때마다 남의 코드가 깨진다.

    공개 API(대시보드가 부르는 것)는 `openapi.yaml`에 따로 있다.

servers:
  - url: http://localhost:8081
    description: auth (로컬)
  - url: http://localhost:8082
    description: clip (로컬)

tags:
  - name: jobs
    description: 잡 상태 보고 (워커 → Clip). 계약1의 콜백 방향
  - name: stream-keys
    description: 스트림 키 검증 (Media·Clip → Auth). 계약4C
  - name: highlights
    description: 하이라이트 후보 등록 (Chat → Clip). 계약2A

paths:
  /internal/jobs/{jobId}/events:
    post:
      tags: [jobs]
      summary: 잡 상태 보고
      description: |
        워커가 잡의 진행 상황을 알린다. **잡 하나에 여러 번 온다.**

        SQS가 같은 잡을 두 번 배달할 수 있으므로 같은 이벤트도 두 번 올 수 있다.
        `Idempotency-Key`가 같으면 서버는 처음 것만 반영하고 나머지는 조용히 200을 준다.
      operationId: reportJobEvent
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          description: 이벤트 하나의 식별자. 재전송 시 같은 값을 쓴다.
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobEvent' }
      responses:
        '200':
          description: 반영됨. 중복이면 아무것도 바꾸지 않고 200
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobEventAck' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidTransition' }

  /internal/stream-keys/verify:
    post:
      tags: [stream-keys]
      summary: 스트림 키 검증
      description: |
        Media Origin이 SRT 연결을 받았을 때 "이 키가 유효한가"를 묻는다.

        발급은 Auth, 검증도 Auth다. **키 원문을 Media가 보관하지 않는다.**
      operationId: verifyStreamKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [streamId, passphrase]
              properties:
                streamId:
                  type: string
                  description: SRT streamid (ADR-019, Base32 26자)
                passphrase:
                  type: string
                  description: SRT passphrase
      responses:
        '200':
          description: 판정 결과. **키가 틀려도 200이다** — 401을 주면 응답 코드만으로 키 존재 여부가 새어 나간다
          content:
            application/json:
              schema:
                type: object
                required: [valid]
                properties:
                  valid: { type: boolean }
                  broadcastId:
                    type: integer
                    format: int64
                    description: valid=true 일 때만. 이 방송에 세그먼트를 붙인다
                  channelId:
                    type: string
                    description: valid=true 일 때만

  /internal/broadcasts/{streamId}/highlights:
    post:
      tags: [highlights]
      summary: 하이라이트 후보 등록
      description: |
        채팅 판별기가 "여기가 하이라이트 같다"를 알린다. Clip Service가 점프카드로 만든다.

        시각 기준은 **방송 시작을 0으로 하는 밀리초**다. 벽시계가 아니다 —
        수집기와 미디어 서버의 시계가 어긋나도 같은 지점을 가리켜야 한다.
      operationId: registerHighlight
      parameters:
        - name: streamId
          in: path
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          description: 같은 구간을 두 번 올려도 카드가 하나만 생기게 한다
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Highlight' }
      responses:
        '201':
          description: 카드 생성됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  jumpCardId: { type: integer, format: int64 }
        '200':
          description: 이미 있던 카드 (중복 요청)
        '404': { $ref: '#/components/responses/NotFound' }

components:
  schemas:
    JobEvent:
      type: object
      required: [status, occurredAt]
      properties:
        status:
          type: string
          enum:
            - STARTED
            - PROGRESS
            - RETRY_SCHEDULED
            - SUCCEEDED
            - TERMINAL_FAILED
          description: |
            `RETRY_SCHEDULED`는 아직 살아 있다는 뜻이고,
            `TERMINAL_FAILED`는 더 시도하지 않는다는 뜻이다. 둘을 구분해야
            대시보드가 "재시도 중"과 "실패"를 다르게 보여줄 수 있다.
        occurredAt:
          type: string
          format: date-time
          description: UTC ISO-8601
        progressPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: status=PROGRESS 일 때
        resultKey:
          type: string
          description: status=SUCCEEDED 일 때. 결과물 S3 키 또는 유튜브 영상 ID
        error:
          type: object
          description: status=RETRY_SCHEDULED·TERMINAL_FAILED 일 때
          properties:
            code: { type: string }
            message: { type: string }
            retryCount: { type: integer, minimum: 0 }

    JobEventAck:
      type: object
      properties:
        applied:
          type: boolean
          description: false면 중복이라 무시했다는 뜻
        jobStatus:
          type: string
          description: 반영 후 잡의 현재 상태

    Highlight:
      type: object
      required: [streamTimestampMs, window]
      properties:
        streamTimestampMs:
          type: integer
          format: int64
          minimum: 0
          description: 하이라이트 정점. 방송 시작=0 기준 밀리초
        window:
          type: object
          required: [startMs, endMs]
          properties:
            startMs: { type: integer, format: int64, minimum: 0 }
            endMs: { type: integer, format: int64, minimum: 0 }
        score:
          type: number
          description: 판별 신뢰도. 카드 정렬에 쓴다
        signal:
          type: string
          enum: [UNIQUE_CHATTERS, MESSAGE_RATE, HOTKEY]
          description: |
            무엇이 근거였나. `HOTKEY`는 스트리머가 직접 누른 것이라
            판별 결과와 섞이지 않게 구분한다.

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 기계가 분기할 값. 문구가 바뀌어도 이건 안 바뀐다
        message:
          type: string
          description: 사람이 읽을 설명

  responses:
    NotFound:
      description: 대상이 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidTransition:
      description: "허용되지 않는 상태 전이 — 예를 들어 TERMINAL_FAILED 이후의 PROGRESS"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

x-notes: |
  이 문서는 초안이다. 확정 전까지 엔드포인트 경로와 필드명이 바뀔 수 있다.
